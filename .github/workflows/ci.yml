name: Validate project

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without downloading Electron
        run: npm ci --ignore-scripts
      - name: Verify committed version metadata
        run: npm run version:check
      - name: Build, check and test
        run: npm run release:check
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Verify reproducible tracked frontends
        run: git diff --exit-code -- frontend/display/dist frontend/subscription/dist
      - name: Check whitespace
        run: git diff --check
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-tag.mjs
