<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F:\资源_项目 库</title>
<style>
/* ------------------------------------------------------------------
   设计取自 Spotify 设计系统（popular-web-designs / templates/spotify.md）
   核心：near-black 沉浸 + 内容优先（封面是唯一色彩源）+ 药丸/圆形几何
        + 字重对比（700/400）而非字号变化 + 重阴影（深色背景上轻阴影看不见）

   字体：原站用 SpotifyMixUI（自有无衬线）。
   这里刻意不引 Google Fonts —— 这是本机离线工具，国内拉 CDN 字体会卡住整个页面。
   按该系统的原则，字重/字号/字距比具体字体更决定观感，故用系统 CJK 栈。
   ------------------------------------------------------------------ */
:root{
  --bg:#121212;         /* 最深背景 */
  --surface:#181818;    /* 卡片/侧栏 */
  --surface2:#1f1f1f;   /* 按钮/交互面 */
  --card:#252525;       /* 抬升卡片 */
  --fg:#ffffff;
  --dim:#b3b3b3;
  --border:#4d4d4d;
  --accent:#1ed760;     /* 唯一品牌色：只用于播放/激活/主操作 */
  --neg:#f3727f;
  --warn:#ffa42b;
  --blue:#539df5;
  --r-card:8px;
  --r-sm:6px;
  --pill:500px;
  --full:9999px;
  --shadow-lg:rgba(0,0,0,.5) 0 8px 24px;
  --shadow-md:rgba(0,0,0,.3) 0 8px 8px;
  --font:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:210px 1fr;grid-template-rows:1fr auto;
}

/* ---------------- 侧栏 ---------------- */
aside{
  grid-row:1/3;background:var(--bg);border-right:1px solid #1f1f1f;
  padding:20px 12px;display:flex;flex-direction:column;gap:4px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 10px 22px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#000;font-size:13px;flex:0 0 auto}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;color:var(--dim);cursor:pointer;
  font:400 14px/1 var(--font);padding:10px 12px;border-radius:var(--r-sm);
}
nav button:hover{color:var(--fg);background:#1a1a1a}
nav button.on{color:var(--fg);font-weight:700;background:var(--surface2)}
nav button .n{margin-left:auto;font:400 12px/1 var(--mono);color:var(--dim)}

/* ---------------- 目录树（全局侧栏 + 播放器侧栏共用） ---------------- */
.treepane{flex:1 1 auto;min-height:0;overflow:auto;margin:12px -6px 0;padding:0 6px}
.treepane::-webkit-scrollbar{width:7px}
.tgroup{margin-bottom:1px}
.thead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;
  color:var(--dim);cursor:pointer;font:600 11.5px var(--font);font-family:inherit;
  padding:7px 8px;border-radius:var(--r-sm);text-align:left;letter-spacing:.6px}
.thead:hover{background:#1a1a1a;color:var(--fg)}
.thead .car{flex:0 0 auto;width:9px;font-size:8px;color:var(--dim);
  transition:transform .15s;display:inline-block}
.thead.open .car{transform:rotate(90deg)}
.thead .cn{margin-left:auto;font:400 11px var(--mono);color:var(--dim)}
.titems{display:none;margin:1px 0 7px}
.titems.open{display:block}
.titem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  color:var(--dim);cursor:pointer;font:400 12.5px var(--font);font-family:inherit;
  padding:6px 8px 6px 21px;border-radius:var(--r-sm);text-align:left;line-height:1.4}
.titem:hover{background:#1a1a1a;color:var(--fg)}
.titem.cur{color:var(--accent);font-weight:600}
.titem .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .tm{flex:0 0 auto;font:400 10.5px var(--mono);color:var(--dim)}
.titem.cur .tm{color:var(--accent);opacity:.75}

aside .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #1f1f1f;color:var(--dim);font-size:11.5px;line-height:1.6}
aside .foot .copyurl{
  display:flex;align-items:center;gap:6px;width:100%;background:var(--surface2);
  border:0;border-radius:var(--r-sm);padding:7px 9px;color:var(--blue);
  font:400 10.5px var(--mono);cursor:pointer;text-align:left;
}
aside .foot .copyurl:hover{background:#2a2a2a}
aside .foot .copyurl #opdsUrl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .foot .cp{color:var(--dim);font-family:var(--font);font-size:10px;flex:0 0 auto}

/* ---------------- 主区 ---------------- */
main{overflow:auto;padding:0 0 20px}
.topbar{
  position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg) 78%,transparent);
  padding:18px 26px 14px;display:flex;align-items:center;gap:14px;
}
.topbar h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.topbar .sub{color:var(--dim);font-size:13px}
.spacer{flex:1}
.searchbox{position:relative}
.searchbox input{
  background:var(--surface2);color:var(--fg);border:0;
  border-radius:var(--pill);padding:9px 16px 9px 34px;width:230px;font:400 13px var(--font);
  box-shadow:rgb(124,124,124) 0 0 0 1px inset;
}
.searchbox input::placeholder{color:#8a8a8a}
.searchbox input:focus{outline:0;box-shadow:var(--accent) 0 0 0 1px inset}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8a8a8a;font-size:13px}
.view{padding:0 26px}

/* ---------------- 卡片网格 ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:18px}
.card{
  background:var(--surface);border:0;border-radius:var(--r-card);padding:12px;
  cursor:pointer;text-align:left;color:inherit;font-family:var(--font);
  transition:background .18s ease, box-shadow .18s ease;
}
.card:hover{background:var(--surface2);box-shadow:var(--shadow-md)}
.cover{
  aspect-ratio:1/1;width:100%;border-radius:var(--r-sm);overflow:hidden;
  background:#2a2a2a;position:relative;margin-bottom:12px;
  box-shadow:var(--shadow-md);
}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.cover .gen{
  position:absolute;inset:0;display:grid;place-items:center;padding:10px;
  font-weight:700;font-size:15px;color:rgba(255,255,255,.92);text-align:center;
  line-height:1.25;word-break:break-word;
}
.card .t{font-weight:700;font-size:14.5px;margin:0 0 5px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--dim);font-size:12px;margin:0}
.badge{display:inline-block;background:var(--surface2);border-radius:var(--full);
  padding:2px 9px;font:400 11px/1.5 var(--font);color:var(--dim);margin:6px 4px 0 0}
.badge.w{color:var(--warn)}
.badge.a{color:var(--accent)}

/* ---------------- 详情 ---------------- */
.dhead{display:flex;gap:22px;align-items:flex-end;margin-bottom:26px}
.dhead .cover{width:180px;flex:0 0 180px;margin:0}
.dhead .info{min-width:0}
.dhead .kicker{color:var(--dim);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.dhead h2{margin:0 0 10px;font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-.6px}
.dhead .meta{color:var(--dim);font-size:13px;margin-bottom:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playcircle{
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#000;font-size:19px;display:grid;place-items:center;
  box-shadow:var(--shadow-md);transition:transform .12s ease;
}
.playcircle:hover{transform:scale(1.05)}
.pillbtn{
  background:var(--surface2);border:0;color:var(--fg);cursor:pointer;
  border-radius:var(--full);padding:9px 18px;font:700 12.5px var(--font);
  letter-spacing:1.4px;text-transform:uppercase;
}
.pillbtn:hover{background:#2a2a2a}
.pillbtn.ghost{background:transparent;box-shadow:var(--border) 0 0 0 1px inset;color:var(--fg)}
.pillbtn.ghost:hover{box-shadow:#7c7c7c 0 0 0 1px inset;background:#1a1a1a}
.back{background:transparent;border:0;color:var(--dim);cursor:pointer;
  font:400 13px var(--font);padding:6px 0;margin-bottom:8px}
.back:hover{color:var(--fg)}

.sec{font-size:18px;font-weight:600;margin:0 0 14px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.ep{
  background:var(--surface);border:0;border-radius:var(--r-sm);color:var(--fg);
  cursor:pointer;padding:11px 6px;font:700 13px var(--font);text-align:center;
  position:relative;transition:background .15s ease;
}
.ep:hover{background:var(--card)}
.ep .s{display:block;font:400 10px var(--font);color:var(--dim);margin-top:3px}
.ep.seen::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:2px;
  background:var(--accent);border-radius:2px;opacity:.55}
.ep.sp{background:transparent;box-shadow:var(--border) 0 0 0 1px inset;color:var(--dim);font-weight:400}
.ep.sp:hover{color:var(--fg)}
.ep .pg{display:block;font:400 10px var(--mono);color:#8a8a8a;margin-top:3px}
.resourceList{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:22px}
.resourceItem{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
  background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--r-sm);
  color:var(--dim);cursor:pointer;padding:10px 12px;font:400 12px var(--font)}
.resourceItem:hover{background:var(--card);color:var(--fg)}
.resourceDetails{margin:-4px 0 22px}
.resourceDetails summary{display:inline-block;cursor:pointer;color:var(--accent);font-size:12px;padding:4px 0 10px}
.resourceSwitch{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;margin-bottom:2px;scrollbar-width:thin}
.resourceTab{flex:0 0 auto;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:var(--full);
  color:var(--dim);cursor:pointer;padding:8px 13px;font:600 12px var(--font);white-space:nowrap}
.resourceTab:hover{color:var(--fg);background:var(--card)}
.resourceTab.on{background:var(--accent);border-color:var(--accent);color:#07130b}
.versionPicker{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.versionPicker label{color:var(--dim);font-size:12px;white-space:nowrap}
.versionSelect{min-width:150px;max-width:100%;background:var(--surface);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--full);color:var(--fg);cursor:pointer;padding:8px 30px 8px 13px;font:600 12px var(--font)}
.versionSelect:hover{background:var(--card);border-color:rgba(255,255,255,.2)}
.versionSelect:focus{outline:2px solid rgba(30,215,96,.45);outline-offset:1px}

/* ---------------- 音乐：可读的曲目列表 ---------------- */
.musicHero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin:2px 0 24px;padding:20px 22px;border-radius:var(--r-card);
  background:linear-gradient(120deg,#1d3025 0%,#18231d 48%,var(--surface) 100%);
  box-shadow:var(--shadow-md);border:1px solid rgba(30,215,96,.12)
}
.musicHero h2{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.4px}
.musicHero p{margin:6px 0 0;color:#c6d6ca;font-size:12.5px}
.musicHeroStats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.musicChip{padding:6px 10px;border-radius:var(--full);background:rgba(0,0,0,.23);
  color:#d7e9db;font:400 11px var(--mono);white-space:nowrap}
.musicGroup{margin:0 0 26px}
.musicGroupHead{display:flex;align-items:baseline;gap:10px;margin:0 0 9px}
.musicGroupTitle{font-size:17px;font-weight:700;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.musicGroupMeta{color:var(--dim);font:400 11px var(--mono);white-space:nowrap}
.musicList{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px 12px}
.musicRow{min-width:0;display:grid;grid-template-columns:30px minmax(0,1fr) auto auto 26px 26px;
  align-items:center;gap:10px;padding:9px 11px;border:0;border-radius:var(--r-sm);
  background:var(--surface);color:var(--fg);cursor:pointer;text-align:left;font-family:var(--font);
  transition:background .15s ease,transform .15s ease,box-shadow .15s ease}
.musicRow:hover{background:var(--card);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.musicRow.seen{box-shadow:inset 2px 0 0 var(--accent)}
.musicRow .idx{color:#8f8f8f;font:400 11px var(--mono);text-align:center}
.musicRow .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.musicRow .fmt{color:var(--accent);font:700 10px var(--mono);letter-spacing:.5px}
.musicRow .bytes{color:#8f8f8f;font:400 10.5px var(--mono);white-space:nowrap}
.musicRow .play{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  background:var(--accent);color:#07140b;font-size:11px;opacity:.86}
.musicRow:hover .play{opacity:1}
.musicRow .queueAdd{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:var(--dim);
  font:400 17px/20px var(--font);cursor:pointer;padding:0;opacity:.65}
.musicRow:hover .queueAdd{opacity:1}.musicRow .queueAdd:hover{color:var(--accent);background:#23372a}
@media(max-width:720px){
  .musicHero{align-items:flex-start;flex-direction:column;padding:17px}
  .musicHeroStats{justify-content:flex-start}
  .musicList{grid-template-columns:1fr}
  .musicRow{grid-template-columns:28px minmax(0,1fr) auto 30px 24px}
  .musicRow .bytes{display:none}
}

/* ---------------- 体检 ---------------- */
.issue{
  background:var(--surface);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px;
  box-shadow:inset 3px 0 0 var(--warn);
}
.issue.info{box-shadow:inset 3px 0 0 var(--blue)}
.issue.ok{box-shadow:inset 3px 0 0 var(--accent)}
.issue .t{font-weight:700;font-size:14px}
.issue .m{color:var(--dim);font-size:13px;margin-top:4px}
.issue .h{color:var(--blue);font-size:12.5px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:var(--r-card);padding:16px}
.stat .v{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{color:var(--dim);font-size:12px;margin-top:4px}

/* ---------------- 底部正在播放 ---------------- */
.nowbar{
  grid-column:2/3;background:var(--surface);border-top:1px solid #222;
  padding:10px 22px;display:flex;align-items:center;gap:14px;min-height:62px;
  box-shadow:var(--shadow-lg);
}
.nowbar .lbl{color:var(--dim);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.nowbar .tt{font-weight:700;font-size:13.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.nowbar .sub{color:var(--dim);font-size:11.5px}
.nowbar.mini{opacity:.55}
.nowbar.musicActive{visibility:hidden}

/* ---------------- 音乐播放器：底部紧凑栏 ---------------- */
#musicbar{display:none;position:fixed;left:210px;right:0;bottom:0;z-index:80;
  padding:8px 14px 7px;background:rgba(13,13,13,.97);border-top:1px solid #2a2a2a;
  box-shadow:var(--shadow-lg)}
#musicbar.on{display:block}
.musicbarMain{display:flex;align-items:center;gap:5px;min-width:0}
.musicbarMain .vpb{width:30px;height:30px;font-size:15px}
.musicbarTrack{min-width:120px;max-width:28vw;flex:0 1 300px;margin:0 8px}
.musicbarTitle{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musicbarOrig{color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musicbarTime{color:var(--dim);font:400 10.5px var(--mono);white-space:nowrap;margin-left:auto}
#musicSeek{min-width:80px;flex:1;accent-color:var(--accent);cursor:pointer}
#musicVol{width:70px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer}
.musicbarInfo{padding:2px 0 0 105px;color:var(--dim);font:400 10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musicQueuePanel{display:none;position:absolute;right:12px;bottom:74px;width:min(390px,calc(100vw - 230px));
  max-height:58vh;overflow:auto;padding:10px;background:#121212;border:1px solid #333;border-radius:10px;
  box-shadow:var(--shadow-lg)}
.musicQueuePanel.on{display:block}
.musicQueueHead{display:flex;align-items:center;justify-content:space-between;padding:1px 3px 8px;
  color:var(--dim);font-size:11px;border-bottom:1px solid #2a2a2a;margin-bottom:4px}
.musicQueueHead button{border:0;background:none;color:var(--dim);font:400 11px var(--font);cursor:pointer}
.musicQueueHead button:hover{color:var(--fg)}
.musicQueuePanel .queueItem{grid-template-columns:24px minmax(0,1fr) 24px}
@media(max-width:820px){
  #musicbar{left:0;padding:7px 8px}
  .musicbarTrack{max-width:34vw;margin:0 3px}
  .musicbarTime{display:none}
  #musicVol{display:none}
  .musicbarInfo{padding-left:0}
  .musicQueuePanel{right:6px;width:min(390px,calc(100vw - 12px))}
}

/* ---------------- 阅读器：贴合屏幕、不滚动、双页、从右往左 ---------------- */
#reader{position:fixed;inset:0;background:#07080a;z-index:60;display:none;
  flex-direction:column;overflow:hidden}
#reader.on{display:flex}
#rbar{flex:0 0 auto;display:flex;align-items:center;gap:9px;
  padding:9px 14px;border-bottom:1px solid #1b1b1b}
#rbar .ttl{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:30vw}
#rbar .pg{font:400 12.5px var(--mono);color:var(--dim);white-space:nowrap}
#rbar .spacer{flex:1}
.ricon{background:var(--surface2);border:0;color:var(--fg);width:36px;height:36px;
  border-radius:50%;cursor:pointer;font-size:15px;display:grid;place-items:center;flex:0 0 auto}
.ricon:hover{background:#2a2a2a}
.ricon:disabled{opacity:.28;cursor:default}
.rtoggle{background:transparent;border:0;color:var(--dim);cursor:pointer;
  font:400 12px var(--font);padding:6px 11px;border-radius:var(--full);
  box-shadow:var(--border) 0 0 0 1px inset;white-space:nowrap}
.rtoggle:hover{color:var(--fg);background:#1a1a1a}
.rtoggle.on{background:var(--accent);color:#000;font-weight:700;box-shadow:none}

/* 书页舞台：撑满剩余高度。overflow:hidden —— 一页/两页始终整幅可见，永不滚动 */
#rstage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:8px;overflow:hidden;cursor:pointer}
/* 「一屏」= 一页或一对页。尺寸由 layoutSpread() 用 JS 精确算后写成像素，
   不靠 CSS 百分比 —— 百分比在 flex 里对不定高的容器解析不可靠，
   之前正是它导致两页各占半宽、图在各自半宽里居中，中间空出巨大黑沟。 */
.spread{display:flex;align-items:flex-start;justify-content:center;
  border-radius:3px;overflow:hidden;background:#0b0b0b;
  box-shadow:0 10px 40px rgba(0,0,0,.7)}
.spread.rtl{flex-direction:row-reverse}   /* 首屏那页落到右边：日漫从右往左 */
.spread img{display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.rfoot{flex:0 0 auto;text-align:center;color:#6b7280;font-size:11.5px;padding:4px 12px 9px}
/* 阅读器开着的时候锁住背后页面的滚动，免得滚轮把背景滚走 */
body.reading{overflow:hidden}

/* 阅读器主体：左目录 + 右书页。跟播放器的 #vpBody / #vpSide 同一套几何，
   尺寸和观感保持一致，两个「全屏层」看起来才像同一个东西。 */
#rBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:row}
#rSide{flex:0 0 236px;width:236px;background:#0d0d0d;
  border-right:1px solid #1b1b1b;display:flex;flex-direction:column;
  min-height:0;overflow:hidden}
#rSide.off{display:none}
#rSide .st{flex:0 0 auto;padding:11px 12px 2px;color:var(--dim);
  font:600 11.5px var(--font);letter-spacing:.6px}
#rSide .treepane{margin:6px 0 0;padding:0 7px 10px}
/* 话数一多本话列表会顶掉下面的作品树，所以它自己封顶并滚动 */
#rChapPane{flex:0 1 auto;max-height:44%;overflow:auto}
#rTreePane{flex:1 1 auto;min-height:0;overflow:auto}
/* 话数列表没有树的缩进（它不是子项） */
.titem.flat{padding-left:8px}
#rMain{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}

/* ---------------- 阅读器：全屏沉浸模式 ----------------
   目标：整屏只有漫画。顶栏、底部提示、左侧目录全部收起；
   若浏览器支持 Fullscreen API，同时进入真全屏（连浏览器 UI 一起让位）。

   真全屏期间不显示顶栏，也不响应鼠标移动唤出顶栏；只有浏览器退出
   Fullscreen API 后，fullscreenchange 才会移除 .full 并恢复普通顶栏。 */
#reader.full{padding:0}
#reader.full #rbar{
  position:fixed;left:0;right:0;top:0;z-index:8;
  background:rgba(13,13,13,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid #1b1b1b;
  opacity:0;transform:translateY(-100%);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease}
/* 全屏阅读时横栏始终隐藏；退出浏览器全屏后移除 .full，横栏自然恢复。 */
#reader.full #rbar,
#reader.full.ui #rbar{opacity:0;transform:translateY(-100%);pointer-events:none}
#reader.full #rBody{padding-top:0}
#reader.full #rHint{display:none}
/* 目录在沉浸模式下也收起，但**不改 #rSide 的 off 类** ——
   退出全屏时要原样恢复用户之前的开关状态。 */
#reader.full #rSide{display:none}
#reader.full #rstage{padding:0}
/* 光标静置后藏起来。这是「全屏」感的一半 —— 留着箭头会一直提醒你这是个网页。 */
#reader.full.idle{cursor:none}
#reader.full.idle #rbar{opacity:0;transform:translateY(-100%);pointer-events:none}

/* ---------------- 阅读器：窄屏（手机）适配 ----------------
   实测 412x915（一加 Ace 6）下顶栏会横向溢出：「双页」被切掉，
   「从右往左」「首页单页」「✕」整个被挤出屏幕 —— 手机上就点不到了。
   做法：改用两行布局（flex-wrap），并把常用项留在第一行：
     第一行 = 目录 · 页码 · 话数 · 关闭      （阅读时真正会动的）
     第二行 = 双页 · 从右往左 · 首页单页      （设一次就不动，放下面）
   靠 `order` 重排，**不改 DOM 顺序** —— 宽屏下仍是原来那条单行，互不影响。
   另让出三项冗余：标题（页码已说明在哪一话）、上下页箭头（手机本就点左右半屏）、
   长段键盘提示（手机上根本没键盘）。功能一个不丢，也不用做溢出菜单。

   ⚠ 验证窄屏**不要**用 headless 的 `--window-size=412` —— 它强制最小宽度 526，
   再用截图裁到 412，看起来就像右边被切了（我为此误判过一轮）。
   正确做法：在宽窗口里放一个 412px 的 iframe 去量（见 _归档日志/probe_mobile.html）。 */
@media (max-width: 820px){
  #rbar{flex-wrap:wrap;gap:6px;padding:7px 10px}
  #rTreeBtn{order:1}  #rPg{order:2}  #rChap{order:3}  #rFull{order:4}  #rClose{order:5}
  #rbar .spacer{order:6}                       /* 撑满第一行剩余空间，逼后面换行 */
  #rDual{order:7}  #rDir{order:8}  #rCover{order:9}
  #rbar .ttl{display:none}          /* 标题让位给控件 */
  #rPrev,#rNext{display:none}       /* 点半屏 / 滑动已能翻页 */
  #rbar .pg{font-size:12px}
  .ricon{width:32px;height:32px;font-size:14px}
  .rtoggle{padding:5px 9px;font-size:11.5px}
  .vpsel{max-width:104px;padding:6px 9px;font-size:11.5px}
  .rfoot{font-size:10.5px;padding:3px 10px 7px}
}

<script>
// 静态前端与资源库后端解耦：GitHub Pages / 本地静态服务器都可通过配置 API 地址工作。
// 例如：window.RESLIB_API_BASE = 'http://100.84.101.43:8777';
const API_BASE = String(window.RESLIB_API_BASE || '').replace(/\/+$/, '');
const apiUrl = path => API_BASE + (String(path).startsWith('/') ? path : '/' + path);
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const size = n => { let u = ['B','KB','MB','GB','TB'], i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(1) + u[i]; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const pct = n => Math.round(n * 100) + '%';

let LIB = null, HEALTH = null, PROG = {};
let META = {}, SUBS = {}, SETTINGS = {};   // 刮削元数据 / 订阅 / 设置
let TAB = localStorage.tab || 'health';
let QUERY = '';
let DETAIL = null;                 // {kind, idx}
/* 阅读器状态。
   双页展开不是简单的「n 和 n+1」——必须先把整本切成「屏」（spreads）：
     · 合页大图（宽 > 高）自己占一屏，不跟任何页配对
     · 第一页通常是封面，默认也单独占一屏
   这样翻页就是 spreads 数组上的 si ± 1，边界/配对/方向都只需在一处算清。 */
const RMODE_KEY = 'reslib.readerMode';
let rmode = Object.assign({ dual: true, rtl: true, cover: true },
                          JSON.parse(localStorage.getItem(RMODE_KEY) || '{}'));
const saveRmode = () => localStorage.setItem(RMODE_KEY, JSON.stringify(rmode));
function loadVersionPrefs() {
  try {
    const v = SETTINGS && SETTINGS.anime_version_preferences;
    return v && typeof v === 'object' ? v : {};
  } catch (_) { return {}; }
}
let versionPrefSaveQueue = Promise.resolve();
function saveVersionPref(workKey, versionKey) {
  const prefs = loadVersionPrefs();
  prefs[workKey] = String(versionKey);
  SETTINGS.anime_version_preferences = prefs;
  // 连续快速切换时排队写入，保证服务端最后保存的是最后一次选择。
  versionPrefSaveQueue = versionPrefSaveQueue.then(async () => {
    const saved = await apiPost('/api/settings', { anime_version_preferences: prefs });
    if (saved && !saved.error) SETTINGS = saved;
    else toast('版本偏好保存失败');
  }).catch(() => toast('版本偏好保存失败'));
}

let reader = { pages: [], spreads: [], si: 0, path: '', title: '' };

/* 支持 ?tab=anime&work=0 深链接：可收藏、也方便无头截图核查 */
const QP = new URLSearchParams(location.search);
if (['health', 'anime', 'sleep', 'movie', 'comic', 'music'].includes(QP.get('tab'))) TAB = QP.get('tab');
if (QP.has('work')) DETAIL = { kind: TAB, idx: parseInt(QP.get('work'), 10) || 0 };
/* ?read=<章节序号>&page=<页序号> —— 直接打开阅读器（也方便无头截图验收）
   &dual=0/1 &rtl=0/1 &cover=0/1 —— 临时覆盖阅读模式，用于分享特定视图和自动化验证 */
const READ_QP = QP.has('read') ? (parseInt(QP.get('read'), 10) || 0) : null;
const PAGE_QP = QP.has('page') ? (parseInt(QP.get('page'), 10) || 0) : 0;
/* ?play=<集序号> —— 直接打开网页播放器（书签 + 无头截图验收都用它） */
const PLAY_QP = QP.has('play') ? (parseInt(QP.get('play'), 10) || 0) : null;
/* ?full=1 —— 以全屏模式打开阅读器（书签用；也方便无头验收那个模式） */
const FULL_QP = QP.has('full') && QP.get('full') !== '0';
for (const k of ['dual', 'rtl', 'cover']) {
  if (QP.has(k)) rmode[k] = QP.get(k) !== '0';
}
function syncUrl() {
  const p = new URLSearchParams();
  if (TAB !== 'health') p.set('tab', TAB);
  if (DETAIL) p.set('work', DETAIL.idx);
  const q = p.toString();
  history.replaceState(null, '', q ? '?' + q : location.pathname);
}

/* 无封面时生成一个稳定的渐变 —— 让网格看起来是有意的，而不是缺图 */
function grad(seed) {
  let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) & 0xffff;
  const a = h % 360, b = (a + 42 + (h >> 4) % 60) % 360;
  return `linear-gradient(140deg, hsl(${a} 42% 26%), hsl(${b} 48% 15%))`;
}
function coverNode(url, title, cls) {
  const d = el('div', 'cover' + (cls ? ' ' + cls : ''));
  d.style.background = grad(title);
  if (url) {
    const im = el('img');
    im.loading = 'lazy'; im.alt = ''; im.src = url;
    im.onerror = () => { im.remove(); d.appendChild(el('div', 'gen', esc(title))); };
    d.appendChild(im);
  } else {
    d.appendChild(el('div', 'gen', esc(title)));
  }
  return d;
}

/* ---------------- 目录树 ---------------- */
/* 两级：分类 → 作品。
   最小一级就是「这一季动画 / 这一部漫画」本身，**不再往下钻到单集** ——
   那样目录会长得没边，而且点开作品详情页就能选集。
   同一套构建函数渲染到两个地方：全局侧栏 + 播放器左侧。 */

const TREE_KEY = 'reslib.treeOpen';
let treeOpen = Object.assign(
  { anime: true, sleep: true, movie: true, comic: true, music: false, novel: false },
  JSON.parse(localStorage.getItem(TREE_KEY) || '{}'));

const TREE_LABEL = { anime: '动画', sleep: '助眠', movie: '电影', comic: '漫画', music: '音乐', novel: '小说' };

/* 把库整理成 [{tab, leaves:[{kind,w,i,title,sub,dir}]}] */
function treeGroups() {
  const out = [];
  const add = (tab, kind, arr) => {
    arr = arr || [];
    if (!arr.length) return;
    out.push({
      tab, count: arr.length,
      leaves: arr.map((w, i) => {
        const m = metaOf(w.dir);
        // 刮削到的中文名更准，有就用它
        let title = (m && (m.title_cn || m.title)) || w.title;
        if (kind === 'anime' && w.season && !title.includes(w.season)) {
          title += ' · ' + w.season;
        }
        let sub = '';
        if (kind === 'anime') sub = w.count + ' 集' + (w.version_count > 1 ? ' · ' + w.version_count + ' 个版本' : '');
        else if (kind === 'sleep') sub = w.count + ' 个视频';
        else if (kind === 'movie') sub = w.year || (m && m.date ? m.date.slice(0, 4) : '');
        else if (kind === 'comic') sub = w.count + ' 话';
        else if (kind === 'music') sub = w.count + ' 首';
        else if (kind === 'novel') sub = w.count + ' 本';
        return { kind, w, i, title, sub, dir: w.dir };
      }),
    });
  };
  add('anime', 'anime', LIB.anime);
  add('sleep', 'sleep', LIB.sleep);
  add('movie', 'movie', LIB.movie);
  add('comic', 'comic', LIB.comic);
  add('music', 'music', LIB.music);
  add('novel', 'novel', LIB.novel);
  return out;
}

/* 一集的字幕信息，**永远返回对象**。服务端现在一定会给 subs，
   但前端不该因为漏一个字段就把整页打成白屏（我造测试数据时就踩到了）。 */
function subsOf(e) {
  const s = (e && e.subs) || {};
  return { sc: s.sc || '', tc: s.tc || '', other: s.other || [] };
}
function noSubs(e) {
  const s = subsOf(e);
  return !s.sc && !s.tc && !s.other.length;
}

/* 这条媒体路径属于哪部作品？返回 {kind, w, i, idx} 或 null。
   选集下拉要用它把「当前正在播的那一集」映射回它的作品和序号。 */
function workOfPath(p) {
  if (!LIB || !p) return null;
  for (const tab of ['anime', 'sleep', 'movie']) {
    const arr = LIB[tab] || [];
    for (let i = 0; i < arr.length; i++) {
      for (const gr of (arr[i].groups || [])) {
        const gi = (gr.episodes || []).findIndex(e => e.path === p);
        if (gi >= 0) return { kind: tab, w: arr[i], i, idx: gi, group: gr };
      }
      const idx = (arr[i].episodes || []).findIndex(e => e.path === p);
      if (idx >= 0) return { kind: tab, w: arr[i], i, idx };
    }
  }
  const cs = LIB.comic || [];
  for (let i = 0; i < cs.length; i++) {
    const idx = (cs[i].chapters || []).findIndex(c => c.path === p);
    if (idx >= 0) return { kind: 'comic', w: cs[i], i, idx };
  }
  return null;
}

/* 下拉里每一条的文字。裸数字就补成「第 03 集」（漫画传 unit='话'）；
   已经有描述性的标签（如「正片」「350--387」）就原样用。 */
function epOptionText(label, i, unit) {
  const u = unit || '集';
  const s = String(label == null ? '' : label).trim();
  return /^\d+(\.\d+)?$/.test(s) ? '第 ' + s + ' ' + u
       : (s || ('第 ' + (i + 1) + ' 项'));
}

/* 关掉任何开着的全屏层（播放器 / 阅读器）。切作品前先收干净。 */
function closeOverlays() {
  if ($('#vp').classList.contains('on')) closePlayer();
  if ($('#reader').classList.contains('on')) closeReader();
}

/* 点目录里的一部作品 —— **只跳到「选集」那一页，不直接开播**。
   用户的意图是「我想看这部」，具体从哪一集开始应该由他在选集页上决定；
   直接播第一集等于替他做了选择，而且想换集还得先关播放器。
   音乐没有「选集」这一层（列表本身就是曲目表），所以切到音乐页即可。 */
function pickLeaf(lf) {
  if (lf.kind === 'music') {
    closeOverlays();
    go('music');
    return;
  }
  if (lf.kind === 'novel') {
    // 小说还没有独立的浏览页，先在体检页提示一下，别假装能打开
    closeOverlays();
    go('health');
    toast('小说的浏览页还没做');
    return;
  }
  // 动画 / 助眠 / 电影 / 漫画：都跳详情页（那里就是选集/选话的地方）
  closeOverlays();
  go(lf.kind === 'comic' ? 'comic' : lf.kind);
  openDetail(lf.kind === 'comic' ? 'comic' : lf.kind, lf.i);
}

/* 把树渲染进 host。curPath 用来高亮正在播的那一部。 */
function renderTree(host, curPath) {
  if (!host) return;
  host.innerHTML = '';
  const groups = treeGroups();
  if (!groups.length) {
    host.appendChild(el('div', 'empty', '库里还没内容'));
    return;
  }
  groups.forEach(g => {
    const box = el('div', 'tgroup');
    const isOpen = !!treeOpen[g.tab];
    const hd = el('button', 'thead' + (isOpen ? ' open' : ''));
    hd.appendChild(el('span', 'car', '▶'));
    hd.appendChild(el('span', '', TREE_LABEL[g.tab] || g.tab));
    hd.appendChild(el('span', 'cn', String(g.count)));
    const items = el('div', 'titems' + (isOpen ? ' open' : ''));
    g.leaves.forEach(lf => {
      const cur = curPath && lf.dir && curPath.startsWith(lf.dir);
      const b = el('button', 'titem' + (cur ? ' cur' : ''));
      b.appendChild(el('span', 'tt', esc(lf.title)));
      if (lf.sub) b.appendChild(el('span', 'tm', esc(lf.sub)));
      b.title = lf.dir || lf.title;
      b.onclick = () => pickLeaf(lf);
      items.appendChild(b);
    });
    hd.onclick = () => {
      treeOpen[g.tab] = !treeOpen[g.tab];
      hd.classList.toggle('open', treeOpen[g.tab]);
      items.classList.toggle('open', treeOpen[g.tab]);
      localStorage.setItem(TREE_KEY, JSON.stringify(treeOpen));
    };
    box.appendChild(hd);
    box.appendChild(items);
    host.appendChild(box);
  });
}

/* 三个地方一起刷新（库变了、换片了都调它）：全局侧栏、播放器左侧、阅读器左侧 */
function refreshTrees() {
  if (!LIB) return;
  const cur = $('#reader').classList.contains('on')
    ? (reader && reader.path)
    : (vp ? vp.path : null);
  renderTree($('#tree'), cur);
  renderTree($('#vpTree'), cur);
  renderTree($('#rTree'), cur);
}



/* 刮削元数据和订阅状态单独取。
   刻意不跟 /api/library 混在一起 —— index 在服务端是启动时建一次的，
   而这俩随时会变（刚刮完、刚查完更新），单独一个轻量接口现取现用。 */
async function loadExtras() {
  try {
    const [ex, st] = await Promise.all([
      fetch(apiUrl('/api/extras')).then(r => r.json()),
      fetch(apiUrl('/api/settings')).then(r => r.json()),
    ]);
    META = (ex && ex.meta) || {};
    SUBS = (ex && ex.subs) || {};
    if (st && !st.error) SETTINGS = st;
  } catch (e) { /* 拿不到就当没有，界面照常能用 */ }
}

async function apiPost(url, body) {
  try {
    const r = await fetch(apiUrl(url), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    return await r.json();
  } catch (e) { return { error: String(e) }; }
}

const metaOf = dir => META[dir] || null;
const subOf = t => SUBS[t] || null;
/* 刮削来的封面优先 —— 比「第一话第一页」更像封面 */
const posterUrl = dir => apiUrl('/api/poster?dir=' + encodeURIComponent(dir));
const CONF = { high: '匹配可信', medium: '匹配一般', low: '匹配存疑' };
const pad2 = n => String(n || 0).padStart(2, '0');
const fmtHour = (h, m) => pad2(h) + ':' + pad2(m);
function fmtTime(t) {
  const d = new Date(t * 1000);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
    + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
async function refreshLib() {
  try { LIB = await fetch(apiUrl('/api/library')).then(r => r.json()); } catch (e) {}
}

/* ---- 动画：作品信息面板 ---- */
function metaPanel(w) {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec', '作品信息'));
  const m = metaOf(w.dir);
  const p = el('div', 'panel');
  wrap.appendChild(p);
  const body = el('div', 'body');
  p.appendChild(body);

  if (!m) {
    body.appendChild(el('div', 'name', '暂无数据'));
    const a = el('div', 'acts');
    const b = el('button', 'pillbtn', '刮削');
    b.onclick = () => runScrape(w, b);
    a.appendChild(b); body.appendChild(a);
    return wrap;
  }

  // 顶部作品头已经展示封面和刮削中文名；这里保留原名、评分、简介和标签，
  // 避免同一张封面和同一个标题在页面上重复出现。
  if (m.title && m.title_cn && m.title !== m.title_cn) {
    body.appendChild(el('div', 'orig', esc(m.title)));
  }

  const f = el('div', 'facts');
  if (m.rating) f.appendChild(el('span', '', esc(m.rating_source || m.source_name || 'Bangumi') + ' <span class="score">' + esc(m.rating) + '</span>'));
  if (m.rank) f.appendChild(el('span', '', '排名 <b>#' + esc(m.rank) + '</b>'));
  if (m.date) f.appendChild(el('span', '', '<b>' + esc(m.date) + '</b> 开播'));
  if (m.platform) f.appendChild(el('span', '', esc(m.platform)));
  // 集数只对番剧有意义 —— 电影在 Bangumi 上也是 eps=1，写「全 1 集」很怪
  if (w.kind === 'anime' && m.eps) {
    f.appendChild(el('span', '', '全 <b>' + esc(m.eps) + '</b> 集'));
    if (w.version_count > 1) {
      f.appendChild(el('span', '', '本地 <b>' + esc(w.version_count) + '</b> 个版本 · <b>' + esc(w.count) + '</b> 集'));
    // 单一版本才拿 Bangumi 的集数跟本地比 —— 合并版本后总数必然大于条目集数
    } else if (w.count && w.count < m.eps) {
      f.appendChild(el('span', '', '<span class="pending">库里只有 ' + w.count + '/' + esc(m.eps) + ' 集</span>'));
    }
  }
  f.appendChild(el('span', '', esc(CONF[m.confidence] || m.confidence || '')));
  body.appendChild(f);

  if (m.summary) {
    const d = el('div', 'desc', esc(m.summary));
    body.appendChild(d);
    if (m.summary.length > 110) {
      const mo = el('button', 'more', '展开简介 ▾');
      mo.onclick = () => {
        d.classList.toggle('open');
        mo.textContent = d.classList.contains('open') ? '收起 ▴' : '展开简介 ▾';
      };
      body.appendChild(mo);
    }
  }
  if (m.tags && m.tags.length) {
    const tg = el('div', 'facts');
    m.tags.slice(0, 8).forEach(t => tg.appendChild(el('span', 'badge', esc(t))));
    body.appendChild(tg);
  }

  const a = el('div', 'acts');
  const rb = el('button', 'pillbtn', '重新刮削');
  rb.onclick = () => runScrape(w, rb);
  a.appendChild(rb);
  if (m.source_url || m.bgm_url) {
    const lk = el('a', 'lnk', '在 ' + esc(m.source_name || 'Bangumi') + ' 查看 ↗');
    lk.href = m.source_url || m.bgm_url; lk.target = '_blank'; lk.rel = 'noopener';
    a.appendChild(lk);
  }
  body.appendChild(a);
  return wrap;
}

async function runScrape(w, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '刮削中…';
  const r = await apiPost('/api/scrape', { dir: w.dir, title: w.dir_name || w.title });
  btn.disabled = false; btn.textContent = old;
  if (r && r.ok) { toast('刮削完成'); await loadExtras(); render(); }
  else toast('没找到匹配的条目');
}

/* ---- 漫画：订阅面板 ---- */
function subPanel(w) {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec', '订阅更新'));
  const p = el('div', 'panel');
  const body = el('div', 'body');
  p.appendChild(body); wrap.appendChild(p);
  const s = subOf(w.title);

  if (!s) {
    body.appendChild(el('div', 'name', '暂无订阅'));
    const a = el('div', 'acts');
    const b = el('button', 'pillbtn', '添加订阅');
    b.onclick = () => subSearch(w, body);
    a.appendChild(b); body.appendChild(a);
    return wrap;
  }

  const lab = el('label', 'subrow');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = s.enabled !== false;
  cb.onchange = async () => {
    const r = await apiPost('/api/subs', { action: 'toggle', name: w.title, enabled: cb.checked });
    if (r.error) { toast(r.error); cb.checked = !cb.checked; return; }
    toast(cb.checked ? '已开启定时订阅' : '已暂停定时订阅');
    await loadExtras(); render();
  };
  lab.appendChild(cb);
  lab.appendChild(el('span', '', '每天定时查更新（' +
    fmtHour(SETTINGS.subscribe_hour, SETTINGS.subscribe_minute) + '）'));
  body.appendChild(lab);

  const st = el('div', 'substat');
  st.appendChild(el('span', '', '订阅源'));
  st.appendChild(el('b', '', esc(s.source + ' / ' + s.slug)));
  st.appendChild(el('span', '', '源站'));
  st.appendChild(el('b', '', s.known + ' 话' + (w.count ? '，本地 ' + w.count + ' 话' : '')));
  st.appendChild(el('span', '', '上次检查'));
  st.appendChild(el('b', '', s.last_check ? fmtTime(s.last_check) : '从未'));
  body.appendChild(st);

  if (s.last_new && s.last_new.length) {
    body.appendChild(el('div', 'newlist',
      '最近新增：' + esc(s.last_new.slice(0, 8).join('、'))));
  }
  if (s.pending && s.pending.length) {
    body.appendChild(el('div', 'warns',
      '⚠ 有 ' + s.pending.length + ' 话还没下下来，下次检查会重试'));
  }
  if (s.last_error) {
    body.appendChild(el('div', 'warns', '⚠ ' + esc(s.last_error)));
  }

  const a = el('div', 'acts');
  const nb = el('button', 'pillbtn', '立即检查更新');
  nb.onclick = async () => {
    nb.disabled = true; const t = nb.textContent; nb.textContent = '检查中…';
    const r = await apiPost('/api/subs', { action: 'check', name: w.title, download: true });
    nb.disabled = false; nb.textContent = t;
    if (r.error) toast(r.error);
    else if (r.downloaded) toast('下了 ' + r.downloaded + ' 话新内容');
    else if (r.updated) toast('有更新，但没下下来（看下方提示）');
    else toast('没有新内容');
    await loadExtras();
    if (r.downloaded) await refreshLib();
    render();
  };
  a.appendChild(nb);

  const rb = el('button', 'pillbtn ghost', '取消订阅');
  rb.onclick = async () => {
    if (!confirm('取消《' + w.title + '》的订阅？已下载的内容不会删。')) return;
    await apiPost('/api/subs', { action: 'remove', name: w.title });
    toast('已取消订阅'); await loadExtras(); render();
  };
  a.appendChild(rb);
  body.appendChild(a);
  return wrap;
}

function subSearch(w, body) {
  const box = el('div');
  const f = el('div', 'field');
  const inp = el('input'); inp.type = 'text'; inp.value = w.title;
  inp.style.flex = '1'; inp.style.minWidth = '220px';
  const sb = el('button', 'pillbtn', '搜索');
  f.appendChild(inp); f.appendChild(sb);
  box.appendChild(f);
  body.appendChild(box);
  const hits = el('div', 'hits');
  body.appendChild(hits);

  async function go() {
    hits.innerHTML = '';
    hits.appendChild(el('div', 'orig', '搜索中…'));
    const r = await apiPost('/api/subs', { action: 'search', q: inp.value });
    hits.innerHTML = '';
    const list = (r && r.hits) || [];
    if (!list.length) {
      hits.appendChild(el('div', 'orig', '没搜到。换个关键词试试。'));
      return;
    }
    list.forEach(h => {
      const slug = h[0], t = h[1];
      const b = el('button', '', esc(t) + '<small>' + esc(slug) + '</small>');
      b.onclick = async () => {
        b.disabled = true;
        const rr = await apiPost('/api/subs', { action: 'add', name: w.title, slug: slug });
        if (rr.error) { toast(rr.error); b.disabled = false; return; }
        toast('已订阅'); await loadExtras(); render();
      };
      hits.appendChild(b);
    });
  }
  sb.onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  go();
}

  async function loadCache() {

    line.innerHTML = '';

async function load() {
  [LIB, HEALTH, PROG] = await Promise.all([
    fetch(apiUrl('/api/library')).then(r => r.json()),
    fetch(apiUrl('/api/health')).then(r => r.json()),
    fetch(apiUrl('/api/progress')).then(r => r.json()),
  ]);
  await loadExtras();
  const s = LIB.stats;
  $('#nH').textContent = HEALTH.filter(i => i.level === 'warn').length || '';
  $('#nA').textContent = s.anime_works;
  $('#nS').textContent = s.sleep_works || '';
  $('#nF').textContent = s.movie_works || '';
  $('#nC').textContent = s.comic_works;
  $('#nM').textContent = s.music_tracks;
  $('#footSize').textContent = `合计 ${size(s.total_size)}`;
  $('#opdsUrl').textContent = (API_BASE || location.origin) + '/opds';
  $('#opdsBtn').onclick = () => {
    navigator.clipboard.writeText((API_BASE || location.origin) + '/opds')
      .then(() => toast('OPDS 地址已复制'))
      .catch(() => toast((API_BASE || location.origin) + '/opds'));
  };
  drawNow();
  render();
  refreshTrees();
  // ?read=<章节>&page=<页> 直接打开阅读器（书签 + 无头截图验收都用它）
  if (READ_QP !== null && TAB === 'comic' && DETAIL) {
    const w = LIB.comic[DETAIL.idx];
    const c = w && w.chapters[READ_QP];
    if (c) {
      // 必须 await：setReaderFull 会立刻排书页尺寸，
      // 而 openComic 里有一趟 fetch —— 不等它跑完，重排就落在空数据上。
      await openComic(c.path, w.title + ' ' + c.label, isPaged(c.ext), PAGE_QP);
      if (FULL_QP) setReaderFull(true);      // 深链接进全屏
    }
  }
  // ?play=<集序号> 直接开播（同样是给书签和验收用的）
  if (PLAY_QP !== null && (TAB === 'anime' || TAB === 'sleep' || TAB === 'movie') && DETAIL) {
    const arr = TAB === 'anime' ? LIB.anime : (TAB === 'sleep' ? (LIB.sleep || []) : (LIB.movie || []));
    const w = arr[DETAIL.idx];
    const e = w && w.episodes[PLAY_QP];
    if (e) play(e.path, w.title + ' ' + e.label);
  }
  // 音乐也能直接播：?tab=music&play=<曲目序号>
  if (PLAY_QP !== null && TAB === 'music') {
    let n = 0;
    for (const w of LIB.music) {
      for (const t of w.tracks) {
        if (n++ === PLAY_QP) { playAudio(t.path, t.title, { queue: LIB.music.flatMap(x => x.tracks || []) }); break; }
      }
      if (n > PLAY_QP) break;
    }
  }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800);
}

/* ---------------- 路由 ---------------- */
function go(tab) { TAB = tab; DETAIL = null; localStorage.tab = tab; syncUrl(); render(); }
function openDetail(kind, idx) { DETAIL = { kind, idx }; syncUrl(); render(); $('main').scrollTop = 0; }
function back() { DETAIL = null; syncUrl(); render(); }

const TITLES = { health: '体检', anime: '动画', sleep: '助眠', movie: '电影', comic: '漫画', music: '音乐' };

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  const v = $('#view'); v.innerHTML = '';
  const list = matches();
  if (DETAIL) return renderDetail(v);
  $('#pageTitle').textContent = TITLES[TAB];
  $('#pageSub').textContent = subFor(TAB, list);
  ({ health: drawHealth, anime: drawAnime, sleep: drawSleep, movie: drawMovies, comic: drawComic, music: drawMusic }[TAB])(v, list);
}

function matches() {
  const q = QUERY.trim().toLowerCase();
  const f = arr => !q ? arr : arr.filter(w => (w.title || '').toLowerCase().includes(q));
  /* `|| []` 是防旧服务端：没重启时 LIB.movie 还不存在 */
  return { anime: f(LIB.anime || []), sleep: f(LIB.sleep || []), movie: f(LIB.movie || []),
           comic: f(LIB.comic || []), music: f(LIB.music || []) };
}
function subFor(tab, L) {
  const s = LIB.stats;
  if (tab === 'anime') return `${L.anime.length} 部 / ${s.anime_eps} 集`;
  if (tab === 'sleep') return `${L.sleep.length} 组 / ${(s.sleep_count || 0)} 个视频`;
  if (tab === 'movie') return `${L.movie.length} 部`;
  if (tab === 'comic') return `${L.comic.length} 部 / ${s.comic_chapters} 话`;
  if (tab === 'music') return `${s.music_artists} 位 / ${s.music_tracks} 首`;
  return `需要处理 ${HEALTH.filter(i => i.level === 'warn').length} 项`;
}

/* ---------------- 体检 ---------------- */

  const s = LIB.stats;
  const sg = el('div', 'statgrid');
  [['动画', s.anime_works + ' 部', s.anime_eps + ' 集 · 特典 ' + s.anime_extras],
   ['漫画', s.comic_works + ' 部', s.comic_chapters + ' 话'],
   ['音乐', s.music_artists + ' 位', s.music_tracks + ' 首'],
   ['总体积', size(s.total_size), '扫描 ' + LIB.elapsed + 's']].forEach(([l, a, b]) => {
    const d = el('div', 'stat');
    d.appendChild(el('div', 'v', esc(a)));
    d.appendChild(el('div', 'l', esc(l + ' · ' + b)));

  v.appendChild(el('div', 'sec', '需要处理'));

  c.appendChild(el('div', 'm', '<code>' + esc((API_BASE || location.origin) + '/opds') + '</code>'));
  v.appendChild(c);

/* ---------------- 音乐 ---------------- */
function drawMusic(v, L) {
  if (!L.music.length) return v.appendChild(el('div', 'empty', '没有匹配的音乐'));
  const tracks = L.music.reduce((n, w) => n + w.tracks.length, 0);
  const embedded = L.music.filter(w => w.embedded).reduce((n, w) => n + w.tracks.length, 0);
  const formats = {};
  L.music.forEach(w => w.tracks.forEach(t => {
    const f = t.ext.slice(1).toUpperCase();
    formats[f] = (formats[f] || 0) + 1;
  }));
  const hero = el('div', 'musicHero');
  const intro = el('div');
  intro.appendChild(el('h2', '', '音乐库'));
  intro.appendChild(el('p', '', L.music.length + ' 个来源 · ' + tracks + ' 首曲目' +
    (embedded ? ' · 含 ' + embedded + ' 首作品原声' : '')));
  hero.appendChild(intro);
  const stats = el('div', 'musicHeroStats');
  Object.keys(formats).sort().forEach(f => stats.appendChild(el('span', 'musicChip', f + ' ' + formats[f])));
  hero.appendChild(stats);
  v.appendChild(hero);
  L.music.forEach(w => {
    const group = el('section', 'musicGroup');
    const head = el('div', 'musicGroupHead');
    head.appendChild(el('div', 'musicGroupTitle', esc(w.title)));
    head.appendChild(el('div', 'musicGroupMeta', w.count + ' 首 · ' + size(w.size) + (w.embedded ? ' · 原声' : '')));
    group.appendChild(head);
    const g = el('div', 'musicList');
    const source = (w.tracks || []).map(x => ({ path: x.path, title: x.title }));
    w.tracks.forEach((t, i) => {
      const b = el('div', 'musicRow' + (PROG[t.path] ? ' seen' : ''));
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.title = t.path;
      b.setAttribute('aria-label', '播放 ' + t.title);
      b.appendChild(el('span', 'idx', String(i + 1).padStart(2, '0')));
      b.appendChild(el('span', 'name', esc(t.title)));
      b.appendChild(el('span', 'fmt', t.ext.slice(1).toUpperCase()));
      b.appendChild(el('span', 'bytes', size(t.size)));
      b.appendChild(el('span', 'play', '▶'));
      const add = el('button', 'queueAdd', '＋');
      add.title = '加入队列';
      add.setAttribute('aria-label', '加入队列');
      add.onclick = e => { e.stopPropagation(); queueAdd({ path: t.path, title: t.title }); };
      b.appendChild(add);
      b.onclick = () => playAudio(t.path, t.title, { queue: source });
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playAudio(t.path, t.title, { queue: source }); } };
      g.appendChild(b);
    });
    group.appendChild(g);
    v.appendChild(group);
  });
}

/* ---------------- 详情 ---------------- */
/* 续读：上次在 PROG 里记了百分比，换算回页号 */
function resumePage(path, total) {
  const p = PROG[path];
  if (p && typeof p.pos === 'number' && p.pos > 0 && total) {
    return Math.min(total - 1, Math.floor(p.pos * total));
  }
  return 0;
}

function renderDetail(v) {
  const kind = DETAIL.kind;
  const isAnime = kind === 'anime';
  const isSleep = kind === 'sleep';
  const isMovie = kind === 'movie';
  const isVideo = isAnime || isSleep || isMovie;
  const w = isAnime ? LIB.anime[DETAIL.idx]
          : isSleep ? (LIB.sleep || [])[DETAIL.idx]
          : isMovie ? (LIB.movie || [])[DETAIL.idx]
          : LIB.comic[DETAIL.idx];
  const m = metaOf(w.dir);
  // 顶栏只放分区名，作品名交给下面的 h2 —— 否则同一个名字在一屏里出现两次
  $('#pageTitle').textContent = TITLES[kind];
  $('#pageSub').textContent = '';

  const b = el('button', 'back', '‹ 返回 ' + TITLES[kind]);
  b.onclick = back;
  v.appendChild(b);

  const h = el('div', 'dhead');
  // 封面：刮削来的海报优先（动画/电影都有），漫画退回到「第一话第一页」。
  // 一张图都没有就不放 —— 塞个写着标题的渐变方块只会跟 h2 重复。
  if (isVideo) {
    if (m && m.poster) {
      const cv = coverNode(posterUrl(w.dir), w.title);
      cv.style.width = '180px'; cv.style.flex = '0 0 180px'; cv.style.margin = '0';
      h.appendChild(cv);
    }
  } else {
    const first = w.chapters[0];
    const cv = coverNode(first ? apiUrl('/cover?path=' + encodeURIComponent(first.path)) : null, w.title);
    cv.style.width = '180px'; cv.style.flex = '0 0 180px'; cv.style.margin = '0';
    h.appendChild(cv);
  }
  const info = el('div', 'info');
  info.appendChild(el('div', 'kicker', isAnime ? '动画系列' : (isSleep ? '助眠视频' : (isMovie ? '电影' : '漫画'))));
  info.appendChild(el('h2', '', esc(w.title)));
  const bits = [];
  if (isMovie) {
    if (m && m.date) bits.push(m.date.slice(0, 4)); else if (w.year) bits.push(w.year);
    if (w.version) bits.push(w.version);
    bits.push(size(w.size));
  } else if (isAnime || isSleep) {
    if (isAnime && w.season) bits.push(w.season);
    if (w.group) bits.push(w.group);
    if (isAnime && w.version_count > 1) bits.push(w.version_count + ' 个版本');
    bits.push(w.count + (isSleep ? ' 个视频' : ' 集'));
    if (isAnime && w.extras.length) bits.push('特典 ' + w.extras.length);
    bits.push(size(w.size));
  } else {
    bits.push(w.count + ' 话');
    bits.push(size(w.size));
  }
  info.appendChild(el('div', 'meta', esc(bits.join(' · '))));

  const acts = el('div', 'actions');
  const eps = isVideo ? w.episodes : w.chapters;
  // 详情页顶部的播放按钮跟随下拉框选中的版本；未选版本时才回退到作品总集数。
  let activeVersionEpisodes = eps;
  if (eps.length) {
    const pb = el('button', 'playcircle', '▶');
    pb.title = isAnime ? '从第 1 集开始播' : (isSleep ? '播放第 1 个视频' : (isMovie ? '播放正片' : '打开第 1 话'));
    pb.onclick = () => {
      const first = activeVersionEpisodes[0] || eps[0];
      if (!first) return;
      if (isVideo) play(first.path, w.title + ' ' + first.label);
      else openComic(first.path, w.title + ' ' + first.label, isPaged(first.ext),

    set.groups.push(displayGroup);
  });
  // 版本偏好由服务端永久保存，按刮削条目标识索引，直到下次修改。
  const versionWorkKey = String(w.bgm_id || w.title || w.dir || (kind + ':' + DETAIL.idx));
  const savedVersionKey = loadVersionPrefs()[versionWorkKey];
  let initialVersion = versionSets.findIndex(set => String(set.key) === String(savedVersionKey));

          eb.title = e.path;

        eb.onclick = () => isVideo
          ? play(e.path, w.title + ' ' + e.label)
          : openComic(e.path, w.title + ' ' + e.label, isCbz, resumePage(e.path, e.pages));
        grid.appendChild(eb);
      });
      pane.appendChild(grid);
    }
    if (resources.length) {
      pane.appendChild(el('div', 'sec', esc((gr.label || '其他资源') + ' · 其他资源（' + resources.length + '）')));
      const details = document.createElement('details');
      details.className = 'resourceDetails';
      const summary = document.createElement('summary');

        rg.appendChild(rb);

  const renderVersion = versionIndex => {
    const set = versionSets[versionIndex] || versionSets[0];
    if (!set) return;
    const regular = set.groups.reduce((all, gr) => all.concat(gr.extra ? [] : (gr.episodes || [])), []);
    activeVersionEpisodes = regular.length
      ? regular
      : set.groups.reduce((all, gr) => all.concat(gr.episodes || []), []);
    sw.innerHTML = '';
    set.groups.forEach((gr, i) => {
      const tb = el('button', 'resourceTab' + (i === 0 ? ' on' : ''), gr.label || ('分组 ' + (i + 1)));
