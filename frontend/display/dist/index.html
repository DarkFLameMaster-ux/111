  if (versionSelect) versionSelect.onchange = () => {
    const next = parseInt(versionSelect.value, 10) || 0;
    const set = versionSets[next] || versionSets[0];
    if (set) saveVersionPref(versionWorkKey, set.key);
    renderVersion(next);
  };
  v.appendChild(sw);
  v.appendChild(pane);
  renderVersion(initialVersion);
}

/* ---------------- 播放 ---------------- */
/* ---------------- 网页内播放器 ---------------- */
/* 为什么不只是一个 <video src>：
   库里的素材基本都是 HEVC-10bit 的 MKV（实测史莱姆、Yani Neko 全是 hevc/Main 10）。
   Chrome **能硬解 HEVC，但只在 MP4 系容器里**，MKV 不行 —— 所以常态是让服务端
   把 MKV 重封装成 MP4（`-c copy`，纯换壳不重编码），之后就是原生 Range 播放：
   拖进度精确瞬发、几乎不占 CPU。`/api/prepare` 会算好该走哪条路。
   万一这台机器连 HEVC 解码器都没有，才回退到 `/transcode` 实时转码 ——
   那是单向线性流，服务端没法「跳到某个字节」，只能带 start=<秒> 重新发起；
   客户端用 vp.offset 把「流内时间」换算回「真实时间」。offset 只在兜底路径上非零。 */

let vp = null;
/* 音乐使用独立的底部播放器，不进入视频播放器的全屏层。 */
const MUSIC_QUEUE_KEY = 'reslib.musicQueue';
const MUSIC_MODE_KEY = 'reslib.musicMode';
const MUSIC_MODES = ['sequence', 'shuffle', 'repeat'];
const MUSIC_MODE_LABEL = { sequence: '顺序', shuffle: '随机', repeat: '单曲循环' };
let musicQueue = [];
let musicIndex = -1;
let musicMode = MUSIC_MODES.includes(localStorage.getItem(MUSIC_MODE_KEY))
  ? localStorage.getItem(MUSIC_MODE_KEY) : 'sequence';
let musicInfo = null;
let musicLoadToken = 0;
let musicLastSave = 0;
const AUDIO_PATH_RE = /\.(?:mp3|m4a|aac|flac|wav|ogg|opus|wma|ape|wv|dsf|dff|tta|aiff)$/i;

function musicItem(x) {
  const path = typeof x === 'string' ? x : (x && x.path);
  if (!path) return null;
  return { path, title: (typeof x === 'object' && x.title) || path.split(/[\\/]/).pop() };
}
function musicQueueSave() {
  try { localStorage.setItem(MUSIC_QUEUE_KEY, JSON.stringify(musicQueue)); } catch (_) {}
}
function musicQueueLoad() {
  try {
    const q = JSON.parse(localStorage.getItem(MUSIC_QUEUE_KEY) || '[]');
    musicQueue = q.map(musicItem).filter(Boolean);
  } catch (_) { musicQueue = []; }
}
function queueSet(items, currentPath) {
  const seen = new Set();
  musicQueue = (items || []).map(musicItem).filter(x => x && !seen.has(x.path) && seen.add(x.path));
  musicIndex = currentPath ? musicQueue.findIndex(x => x.path === currentPath) : -1;
  musicQueueSave();
  renderMusicQueue();
}
function queueAdd(item, autoplay) {
  const x = musicItem(item);
  if (!x) return;
  let i = musicQueue.findIndex(q => q.path === x.path);
  if (i < 0) { musicQueue.push(x); i = musicQueue.length - 1; }
  if (musicIndex < 0 || (autoplay && i >= 0)) musicIndex = i;
  musicQueueSave();
  renderMusicQueue();
  if (autoplay) playAudio(x.path, x.title, { fromQueue: true });
}
function queueRemove(i) {
  if (i < 0 || i >= musicQueue.length) return;
  const wasCurrent = i === musicIndex;
  musicQueue.splice(i, 1);
  if (i < musicIndex) musicIndex--;
  else if (wasCurrent) musicIndex = Math.min(musicIndex, musicQueue.length - 1);
  musicQueueSave();
  renderMusicQueue();
}
function renderMusicQueue() {
  const box = $('#musicQueue');
  if (!box) return;
  box.innerHTML = '';
  if (!musicQueue.length) { box.appendChild(el('div', 'queueEmpty', '暂无')); return; }
  musicQueue.forEach((item, i) => {
    const row = el('div', 'queueItem' + (i === musicIndex ? ' cur' : ''));
    row.title = item.path;
    row.appendChild(el('span', 'qi', String(i + 1).padStart(2, '0')));
    row.appendChild(el('span', 'qt', esc(item.title)));
    const x = el('button', 'qx', '×');
    x.title = '移除'; x.setAttribute('aria-label', '移除');
    x.onclick = e => { e.stopPropagation(); queueRemove(i); };
    row.appendChild(x);
    row.onclick = () => playAudio(item.path, item.title, { fromQueue: true });
    box.appendChild(row);
  });
}
function setMusicMode(mode) {
  musicMode = MUSIC_MODES.includes(mode) ? mode : 'sequence';
  localStorage.setItem(MUSIC_MODE_KEY, musicMode);
  const b = $('#musicMode');
  if (b) { b.textContent = MUSIC_MODE_LABEL[musicMode]; b.title = MUSIC_MODE_LABEL[musicMode] + '播放'; }
}
function cycleMusicMode() {
  const i = MUSIC_MODES.indexOf(musicMode);
  setMusicMode(MUSIC_MODES[(i + 1) % MUSIC_MODES.length]);
}
function musicNextIndex(dir) {
  if (!musicQueue.length) return -1;
  if (musicMode === 'repeat' && dir > 0) return musicIndex;
  if (musicMode === 'shuffle' && dir > 0) {
    if (musicQueue.length < 2) return musicIndex;
    let n = musicIndex;
    while (n === musicIndex) n = Math.floor(Math.random() * musicQueue.length);
    return n;
  }
  const n = musicIndex < 0 ? (dir > 0 ? 0 : musicQueue.length - 1) : musicIndex + dir;
  return (n + musicQueue.length) % musicQueue.length;
}
function musicStep(dir) {
  const i = musicNextIndex(dir);
  if (i < 0) return;
  const x = musicQueue[i];
  playAudio(x.path, x.title, { fromQueue: true });
}
function audioText(v, fallback = '') { return v == null || v === '' ? fallback : String(v); }
function audioTags(info) {
  const out = {};
  const sources = [info && info.tags,
                   info && info.format && info.format.tags,
                   info && info.metadata && info.metadata.format,
                   info && info.metadata && info.metadata.audio,
                   info && info.audio && info.audio.tags];
  sources.forEach(tags => Object.entries(tags || {}).forEach(([k, v]) => {
    if (v != null && v !== '' && out[k.toLowerCase()] == null) out[k.toLowerCase()] = v;
  }));
  return out;
}
function audioRate(n) {
  n = Number(n) || 0;
  if (!n) return '';
  return n >= 1000000 ? (n / 1000000).toFixed(1) + ' Mbps' : Math.round(n / 1000) + ' kbps';
}
function audioOrig(info, title) {
  const t = audioTags(info);
  const track = t.track || t.tracknumber || '';
  return [t.artist || t.album_artist, t.album, track ? ('#' + track) : ''].filter(Boolean).join(' · ') || title;
}
function audioDecode(info) {
  const a = info && info.audio || {};
  const f = info && info.format || {};
  const codec = a.codec || a.codec_name || '';
  const rate = audioRate(a.bit_rate || f.bit_rate);
  const sr = a.sample_rate ? (Number(a.sample_rate) / 1000).toFixed(1) + ' kHz' : '';
  const bits = a.bits_per_sample || a.bits_per_raw_sample;
  const depth = bits ? bits + ' bit' : '';
  const ch = a.channel_layout || (a.channels ? a.channels + ' 声道' : '');
  return [codec.toUpperCase(), rate, depth, sr, ch].filter(Boolean).join(' · ');
}
function renderMusicInfo(info, title) {
  musicInfo = info || null;
  const orig = audioOrig(info, title);
  $('#musicOrig').textContent = orig;
  const source = info && info.name ? info.name : '';
  const dec = audioDecode(info);
  const how = info && info.decode && info.decode.mode === 'transcode' ? '实时转码' : '浏览器原生解码';
  $('#musicInfo').textContent = [source, dec, how].filter(Boolean).join(' · ');
}
function musicSync() {
  const a = $('#musicAudio');
  const dur = Number.isFinite(a.duration) ? a.duration : 0;
  const cur = Number.isFinite(a.currentTime) ? a.currentTime : 0;
  $('#musicPlay').textContent = a.paused ? '▶' : '❚❚';
  $('#musicTime').textContent = fmtT(cur) + ' / ' + fmtT(dur);
  $('#musicSeek').value = dur ? String(Math.round(cur / dur * 1000)) : '0';
  $('#musicMute').textContent = (a.muted || a.volume === 0) ? '🔇' : '🔊';
}
async function playAudio(path, title, opts = {}) {
  title = title || path.split(/[\\/]/).pop();
  if (vp) closePlayer();
  const a = $('#musicAudio');
  const tok = ++musicLoadToken;
  if (opts.queue) queueSet(opts.queue, path);
  else queueAdd({ path, title });
  musicIndex = musicQueue.findIndex(x => x.path === path);
  $('#musicbar').classList.add('on');
  $('#nowbar').classList.add('musicActive');
  $('#musicTitle').textContent = title;
  $('#musicOrig').textContent = '';
  $('#musicInfo').textContent = '读取中';
  renderMusicQueue();
  let info;
  try {
    const r = await fetch(apiUrl('/api/media-info?path=' + encodeURIComponent(path)));
    info = await r.json();
    if (info.error && r.status === 404) {
      info = await fetch(apiUrl('/api/video?path=' + encodeURIComponent(path))).then(x => x.json());
    }
  }
  catch (e) { info = { error: String(e) }; }
  if (tok !== musicLoadToken) return;
  if (info.error) { $('#musicInfo').textContent = info.error; return; }
  renderMusicInfo(info, title);
  const resume = PROG[path] && Number(PROG[path].pos) > 0.005 && Number(PROG[path].pos) < 0.97
    ? Number(PROG[path].pos) : 0;
  if (resume) a.addEventListener('loadedmetadata', () => {
    if (tok === musicLoadToken && Number.isFinite(a.duration) && a.duration > 0) {
      a.currentTime = Math.min(a.duration - 0.3, a.duration * resume);
    }
  }, { once: true });
  const url = info.mode === 'transcode'
    ? apiUrl('/transcode?path=' + encodeURIComponent(path) + '&start=0&h=0')
    : apiUrl('/play?path=' + encodeURIComponent(path));
  a._path = path; a._title = title;
  a.src = url; a.load();
  a.play().catch(() => {});
  musicSync();
}
function stopMusicPlayback() {
  const a = $('#musicAudio');
  if (!a) return;
  a.pause(); a.removeAttribute('src'); a.load();
  $('#musicbar').classList.remove('on');
  $('#musicQueuePanel').classList.remove('on');
  $('#nowbar').classList.remove('musicActive');
}
function musicSaveProgress(force = false) {
  const a = $('#musicAudio'), path = a && a._path;
  if (!path || !Number.isFinite(a.duration) || !a.duration) return;
  const now = Date.now();
  if (!force && now - musicLastSave < 5000) return;
  musicLastSave = now;
  const pos = Math.max(0, Math.min(1, a.currentTime / a.duration));
  PROG[path] = { pos, title: a._title || path, at: now / 1000 };
  fetch(apiUrl('/api/progress'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: path, pos, title: a._title || path }) }).catch(() => {});
}
/* 音乐的队列与播放控件接线。 */
(function musicWire() {
  const a = $('#musicAudio');
  if (!a) return;
  musicQueueLoad();
  setMusicMode(musicMode);
  renderMusicQueue();
  a.addEventListener('loadedmetadata', musicSync);
  a.addEventListener('timeupdate', () => { musicSync(); musicSaveProgress(); });
  a.addEventListener('play', musicSync);
  a.addEventListener('pause', () => { musicSync(); musicSaveProgress(true); });
  a.addEventListener('ended', () => { musicSaveProgress(true); musicStep(1); });
  a.addEventListener('error', () => { $('#musicInfo').textContent = '播放失败'; musicSync(); });
  $('#musicPlay').onclick = () => { if (a.paused) a.play().catch(() => {}); else a.pause(); };
  $('#musicPrev').onclick = () => musicStep(-1);
  $('#musicNext').onclick = () => musicStep(1);
  $('#musicMode').onclick = cycleMusicMode;
  $('#musicQueueBtn').onclick = () => $('#musicQueuePanel').classList.toggle('on');
  $('#musicQueueClear').onclick = () => { musicQueue = []; musicIndex = -1; musicQueueSave(); renderMusicQueue(); };
  $('#musicMute').onclick = () => { a.muted = !a.muted; musicSync(); };
  $('#musicVol').oninput = () => { a.volume = parseFloat($('#musicVol').value); if (a.volume > 0) a.muted = false; musicSync(); };
  $('#musicSeek').oninput = () => {
    if (Number.isFinite(a.duration) && a.duration) a.currentTime = a.duration * Number($('#musicSeek').value) / 1000;
    musicSync();
  };
})();
/* 播放列表开关：左上角那个按钮和 L 键共用这一份状态。
   记进 localStorage —— 用户设一次就不想再设。 */
const SIDE_KEY = 'reslib.vpSide';
function setSide(on) {
  $('#vpSide').classList.toggle('off', !on);
  $('#vpTreeBtn').classList.toggle('on', on);
  localStorage.setItem(SIDE_KEY, on ? '1' : '0');
}
function toggleSide() { setSide($('#vpSide').classList.contains('off')); }
let vpToken = 0;      // 换 src 时会触发过期的 error/canplay，用它把旧事件丢掉
let vpDragging = false;   // 拖进度条时别让 timeupdate 把条子拽回去
let vpLastSave = 0;

function fmtT(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60);
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(x).padStart(2, '0');
}
const vpEl = () => $('#vpEl');
/* 真实播放位置。
   **原生模式**（direct/remux，走 Range）：MP4 是绝对时间轴，currentTime 就是真实时间。
   **转码模式**：转码流从 start=S 开始、时间戳归零，得加 offset 换算。
   这个区分是整套拖动逻辑的核心。 */
function vpAbs() {
  if (!vp) return 0;
  return vp.native ? vpEl().currentTime : vp.offset + vpEl().currentTime;
}
function vpBufferedEnd() {
  const v = vpEl(); let e = 0;
  for (let i = 0; i < v.buffered.length; i++) e = Math.max(e, v.buffered.end(i));
  return e;                       // 也是「流内时间」
}
function resumeSec(path, dur) {
  const p = PROG[path];
  if (p && typeof p.pos === 'number' && p.pos > 0.005 && p.pos < 0.97 && dur > 0) {
    return p.pos * dur;
  }
  return 0;
}

/* 交给 PotPlayer —— 留作退路：ass 的完整特效（字体/定位/特效字幕）只有它能还原 */
async function playExternal(path, title) {
  try {
    const j = await fetch(apiUrl('/api/play'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, prefer: 'sc' })
    }).then(r => r.json());
    if (!j.ok) return toast('播放失败：' + (j.error || ''));
    const subName = j.sub ? j.sub.split('\\').pop().split('/').pop() : '';
    toast('已交给 PotPlayer：' + title + (subName ? '　字幕 ' + subName : ''));
  } catch (e) { toast('播放失败：' + e); }
}

/* 入口：所有播放入口都走这里 */
async function play(path, title) {
  title = title || path.split(/[\\/]/).pop();
  if (AUDIO_PATH_RE.test(path)) {
    playAudio(path, title);
    return;
  }
  stopMusicPlayback();
  $('#vp').classList.add('on');
  $('#vpTitle').textContent = title;
  $('#vpInfo').textContent = '';
  $('#vpSub').innerHTML = '';
  document.body.style.overflow = 'hidden';
  vpFail('正在读取…', path, title, false);

  let info;
  try {
    info = await fetch(apiUrl('/api/video?path=' + encodeURIComponent(path))).then(r => r.json());
  } catch (e) { info = { error: String(e) }; }

  if (info.error) {
    vpFail('放不了这个文件\n' + info.error
           + (info.ffprobe ? '\nffprobe: ' + info.ffprobe : ''), path, title, true);
    return;
  }

  const mode = info.mode || (info.direct ? 'direct' : 'transcode');
  vp = {
    path, title, info, mode,
    offset: 0, dur: info.duration || 0,
    // native：走 Range 的原生播放（direct 原文件 / remux 换壳后的 MP4）
    // 好处是拖动进度条是浏览器原生行为，零 CPU、精确、瞬发
    native: mode !== 'transcode',
    subIdx: -1,
    audioOnly: !info.video,
    triedTranscode: false,
    lastAbs: 0,
  };
  $('#vpStage').classList.toggle('audio', vp.audioOnly);
  const vcodec = info.video
    ? `${info.video.codec} ${info.video.width}×${info.video.height}` : '纯音频';
  const how = { direct: '直接播放', remux: '换壳播放（不重编码）', transcode: '实时转码' }[mode] || mode;
  $('#vpInfo').textContent = `${vcodec} · ${how}`;

  // 换壳要先跑一遍（只换容器，实测整集不到 1 秒），跑完再设 src，
  // 这样界面能明确显示「准备中」，失败也看得到原因。
  if (mode === 'remux') {
    vpFail('准备中…（换壳成 MP4，不重编码）', path, title, false);
    let r;
    try {
      r = await apiPost('/api/prepare', { path });
    } catch (e) { r = { ok: false, error: String(e) }; }
    if (!vp) return;                       // 期间用户关掉了
    if (!r.ok) {
      if (r.mode === 'transcode') {        // 换不了壳就转码兜底
        vp.mode = 'transcode'; vp.native = false;
        $('#vpInfo').textContent = `${vcodec} · 实时转码`;
      } else {
        vpFail('准备失败\n' + (r.error || ''), path, title, true);
        return;
      }
    }
  }

  buildSub();
  buildEps();
  refreshTrees();          // 左上播放列表跟着高亮当前这部
  vpLoadAt(resumeSec(path, vp.dur), true);
}

function vpFail(msg, path, title, showPot) {
  const m = $('#vpMsg');
  m.innerHTML = '';
  m.appendChild(document.createTextNode(msg));
  if (showPot) {
    m.appendChild(document.createElement('br'));
    const b = el('button', 'btn', '用 PotPlayer 打开');
    b.onclick = () => playExternal(path, title);
    m.appendChild(b);
  }
}

/* 从 sec 开始播。
   原生模式：src 固定指向 /play（服务端决定原文件还是缓存），起播位置靠 currentTime；
   转码模式：带 start=S 重新起一次转码。 */
function vpLoadAt(sec, autoplay) {
  if (!vp) return;
  const v = vpEl();
  const tok = ++vpToken;
  let url;
  if (vp.native) {
    vp.offset = 0;                 // 绝对时间轴，不需要 offset
    url = apiUrl('/play?path=' + encodeURIComponent(vp.path));
  } else {
    vp.offset = Math.max(0, sec);
    url = apiUrl('/transcode?path=' + encodeURIComponent(vp.path))
      + '&start=' + vp.offset.toFixed(3) + '&h=0';   // 兜底转码也是原画（换壳才是常态）
    vpFail('转码中…', vp.path, vp.title, false);
  }
  v.src = url;
  if (vp.native) {
    $('#vpMsg').innerHTML = '';
    v.addEventListener('loadedmetadata', () => {
      if (tok !== vpToken) return;
      if (sec > 0 && isFinite(v.duration) && v.duration > 0) {
        v.currentTime = Math.min(sec, v.duration - 0.3);
      }
    }, { once: true });
  }
  v.load();
  if (autoplay) v.play().catch(() => {});
  applySub();
}

/* 跳转。原生模式下就是设个 currentTime —— 浏览器自己发 Range 请求，
   **零 CPU、瞬间到、时间精确**（这正是用户要的）。
   转码模式才需要「能跳就跳、不能跳就带 start 重开转码」。 */
function vpSeek(target) {
  if (!vp) return;
  const v = vpEl();
  if (vp.dur) target = Math.max(0, Math.min(vp.dur - 0.5, target));
  if (vp.native) { v.currentTime = target; return; }
  const lo = vp.offset, hi = vp.offset + vpBufferedEnd();
  if (target >= lo && target <= hi - 1) { v.currentTime = target - lo; return; }
  const wasPlaying = !v.paused && !v.ended;
  vpLoadAt(target, wasPlaying);
}

function applySub() {
  const v = vpEl();
  // 移除旧轨前**先把 cue 清掉并置为 disabled**。
  // 直接 remove() 时，已经显示出来的 cue 在部分浏览器里不会立刻消失 ——
  // 而拖一次进度就会重挂一次轨道，残留会一层层叠上去
  // （用户截图里同一行字幕出现两次，就是这个症状）。
  v.querySelectorAll('track').forEach(t => {
    try {
      const tt = t.track;
      if (tt) {
        tt.mode = 'disabled';
        while (tt.cues && tt.cues.length) tt.removeCue(tt.cues[0]);
      }
    } catch (e) { /* 忽略 */ }
    t.remove();
  });
  if (!vp) return;
  const s = (vp.info.subs || [])[vp.subIdx];
  if (!s) return;
  const tr = document.createElement('track');
  tr.kind = 'subtitles';
  tr.label = s.label || '字幕';
  tr.srclang = (s.lang || 'zh').slice(0, 12);
  /* 关键：把当前转码流的起点 offset 一起发过去。
     转码流的时间从 0 计，而字幕是绝对时间 —— 服务端会按 offset 把时间轴前移，
     否则一拖进度条字幕就整体错位（画面是对白、字幕还在唱 OP 歌词）。
     **原生模式（direct/remux）是绝对时间轴，offset 恒为 0，不需要平移。** */
  const off = vp.native ? 0 : vp.offset;
  tr.src = s.kind === 'embedded'
    ? apiUrl('/api/sub?path=' + encodeURIComponent(vp.path) + '&track=' + s.index)
      + '&offset=' + off.toFixed(3)
    : apiUrl('/api/sub?path=' + encodeURIComponent(s.path))
      + '&offset=' + off.toFixed(3);
  v.appendChild(tr);
  const on = () => { try { tr.track.mode = 'showing'; } catch (e) {} };
  tr.addEventListener('load', on);
  setTimeout(on, 400);            // 有些情况下 load 不触发，兜一下
}

/* 选集下拉。找到当前这一集属于哪部作品，把它的集数列出来。
   只有一集（比如电影）就不摆个无意义的下拉。 */
function buildEps() {
  const sel = $('#vpEp');
  sel.innerHTML = '';
  const own = vp ? workOfPath(vp.path) : null;
  const eps = own ? (own.group ? (own.group.episodes || []) : (own.w.episodes || [])) : [];
  if (eps.length < 2) {
    sel.disabled = true;
    sel.style.display = 'none';
    return;
  }
  sel.style.display = '';
  sel.disabled = false;
  eps.forEach((e, i) => {
    const o = el('option', '', epOptionText(e.label, i));
    o.value = String(i);
    sel.appendChild(o);
  });
  sel.value = String(own.idx);
  sel.title = own.w.title + '　共 ' + eps.length + ' 集';
  sel.onchange = () => {
    const i = parseInt(sel.value, 10);
    const e = eps[i];
    sel.blur();                 // 交出焦点，否则空格/方向键会被下拉吃掉
    if (e) play(e.path, own.w.title + ' · ' + e.label);
  };
}

function buildSub() {
  const sel = $('#vpSub');
  sel.innerHTML = '';
  const subs = (vp && vp.info.subs) || [];
  const off = el('option', '', '字幕：关');
  off.value = '-1';
  sel.appendChild(off);
  subs.forEach((s, i) => {
    const o = el('option', '', '字幕：' + (s.label || ('轨 ' + (i + 1))));
    o.value = String(i);
    sel.appendChild(o);
  });
  // 默认选第一条（外挂简中排在前面）
  vp.subIdx = subs.length ? 0 : -1;
  sel.value = String(vp.subIdx);
  sel.disabled = !subs.length;
  // 选完就把焦点交出去，否则空格/方向键会被 <select> 吃掉
  sel.onchange = () => { vp.subIdx = parseInt(sel.value, 10); applySub(); sel.blur(); };
}


function vpSave() {
  if (!vp) return;
  const dur = vp.dur || vpEl().duration;
  if (!dur || !isFinite(dur) || dur <= 0) return;
  const pos = Math.max(0, Math.min(1, vpAbs() / dur));
  PROG[vp.path] = { pos, title: vp.title, at: Date.now() / 1000 };
  fetch(apiUrl('/api/progress'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: vp.path, pos, title: vp.title })
  }).catch(() => {});
}

function closePlayer() {
  if (!vp) return;
  const p = vp.path;
  vpSave();
  const v = vpEl();
  vpToken++;                      // 让还在路上的事件失效
  v.pause();
  v.removeAttribute('src');
  v.load();
  // 让服务端把 ffmpeg 收掉，别等连接超时
  fetch(apiUrl('/api/stop?path=' + encodeURIComponent(p))).catch(() => {});
  $('#vp').classList.remove('on');
  $('#vpStage').classList.remove('audio');
  $('#vpMsg').innerHTML = '';
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  vp = null;
  drawNow();
  refreshTrees();          // 清掉高亮
  if (DETAIL) render();
}

function vpPlayToggle() {
  const v = vpEl();
  if (v.paused) v.play().catch(() => {}); else v.pause();
}

function vpSyncUI() {
  if (!vp || vpDragging) return;
  const v = vpEl();
  const dur = vp.dur || v.duration || 0;
  const abs = vpAbs();
  $('#vpPlay').textContent = v.paused ? '▶' : '❚❚';
  $('#vpTime').textContent = fmtT(abs) + ' / ' + fmtT(dur);
  const f = dur ? Math.max(0, Math.min(1, abs / dur)) : 0;
  $('#vpFill').style.width = (f * 100) + '%';
  $('#vpKnob').style.left = (f * 100) + '%';
  const b = vpBufferedEnd();
  $('#vpBuf').style.width = (dur ? Math.min(100, ((vp.offset + b) / dur) * 100) : 0) + '%';
}

function vpFullscreen() {
  const box = $('#vp');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else box.requestFullscreen().catch(() => toast('全屏被拒绝'));
}

/* ---- 播放器的事件接线（一次性） ---- */
(function vpWire() {
  const v = vpEl();
  if (!v) return;

  v.addEventListener('timeupdate', () => {
    if (!vp) return;
    vp.lastAbs = vpAbs();          // 回退到转码时要从这个位置接着播
    vpSyncUI();
    const now = Date.now();
    if (now - vpLastSave > 5000) { vpLastSave = now; vpSave(); }
  });
  v.addEventListener('play', vpSyncUI);
  v.addEventListener('pause', () => { vpSyncUI(); vpSave(); });
  // 转码流播完（ffmpeg 输出结束）就是片尾
  v.addEventListener('ended', () => { vpSyncUI(); vpSave(); });
  v.addEventListener('progress', vpSyncUI);
  const clear = () => { $('#vpMsg').innerHTML = ''; };
  v.addEventListener('loadeddata', clear);
  v.addEventListener('playing', clear);
  v.addEventListener('canplay', clear);
  v.addEventListener('waiting', () => {
    if (vp && !vp.native) vpFail('缓冲中…', vp.path, vp.title, false);
  });
  /* 放不出来（解码失败/格式不支持）→ 先自动退回转码，再不行才给出路。
     原生播放依赖系统 HEVC 解码器；万一那台机器没装，这里就是安全网。 */
  v.addEventListener('error', () => {
    if (!vp) return;
    if (vp.native && !vp.triedTranscode) {
      vp.triedTranscode = true;
      const resume = vp.lastAbs || 0;
      vp.mode = 'transcode';
      vp.native = false;
      $('#vpInfo').textContent = '实时转码（原生播放失败，已自动回退）';
      vpLoadAt(resume, true);
      return;
    }
    const code = v.error ? v.error.code : 0;
    vpFail('浏览器放不了这个文件' + (code ? `（错误码 ${code}）` : '')
           + '\n可以改用 PotPlayer。', vp.path, vp.title, true);
  });

  $('#vpPlay').onclick = vpPlayToggle;
  $('#vpClose').onclick = closePlayer;
  $('#vpFull').onclick = vpFullscreen;
  /* 播放列表开关。状态记进 localStorage —— 用户设一次就不想再设。
     按钮在**左上角**，和键盘上的 L 是同一个动作，所以抽成一个函数给两边用。 */
  setSide(localStorage.getItem(SIDE_KEY) !== '0');
  $('#vpTreeBtn').onclick = toggleSide;
  $('#vpPot').onclick = () => { if (vp) playExternal(vp.path, vp.title); };
  $('#vpMute').onclick = () => { v.muted = !v.muted; };
  $('#vpVol').oninput = () => {
    v.volume = parseFloat($('#vpVol').value);
    if (v.volume > 0) v.muted = false;
  };
  v.addEventListener('volumechange', () => {
    if (!document.activeElement || document.activeElement.id !== 'vpVol') {
      $('#vpVol').value = String(v.muted ? 0 : v.volume);
    }
    $('#vpMute').textContent = (v.muted || v.volume === 0) ? '🔇' : '🔊';
  });

  /* 进度条：拖的时候只预览，松手才真跳 ——
     转码流每次跳都可能重启一次 ffmpeg，不能跟着鼠标一路重启 */
  const track = $('#vpTrack');
  const at = cx => {
    const r = track.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (cx - r.left) / Math.max(1, r.width)));
    return { f, t: f * (vp && vp.dur ? vp.dur : 0) };
  };
  const preview = cx => {
    const { f, t } = at(cx);
    $('#vpFill').style.width = (f * 100) + '%';
    $('#vpKnob').style.left = (f * 100) + '%';
    $('#vpTime').textContent = fmtT(t) + ' / ' + fmtT(vp && vp.dur ? vp.dur : 0);
  };
  track.addEventListener('pointerdown', e => {
    if (!vp || !vp.dur) return;
    vpDragging = true;
    track.classList.add('drag');
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
    preview(e.clientX);
  });
  track.addEventListener('pointermove', e => { if (vpDragging) preview(e.clientX); });
  const drop = e => {
    if (!vpDragging) return;
    vpDragging = false;
    track.classList.remove('drag');
    vpSeek(at(e.clientX).t);
  };
  track.addEventListener('pointerup', drop);
  track.addEventListener('pointercancel', () => {
    vpDragging = false; track.classList.remove('drag');
  });
})();

function drawNow() {
  const items = Object.entries(PROG).sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
  const nb = $('#nowbar');
  if (!items.length) { nb.classList.add('mini'); $('#nowTitle').textContent = '还没有播放记录'; $('#nowSub').textContent = ''; $('#nowPlay').disabled = true; return; }
  const [path, p] = items[0];
  nb.classList.remove('mini');
  $('#nowTitle').textContent = p.title || path.split('\\').pop();
  $('#nowSub').textContent = new Date((p.at || 0) * 1000).toLocaleString('zh-CN');
  $('#nowPlay').disabled = false;
  $('#nowPlay').onclick = () => /\.(?:mp3|m4a|aac|flac|wav|ogg|opus|wma|ape|wv|dsf|dff|tta|aiff)$/i.test(path)
    ? playAudio(path, p.title || path) : play(path, p.title || path);
}

/* ---------------- 漫画阅读器 ---------------- */
/* 哪些格式能进我们自己的阅读器逐页翻。
   cbz 是 zip 里的图片；**pdf 由服务端按需渲染成 JPEG**（见 lib.py 的 pdf_render_page）。
   其它格式（cbr/cb7）没有内建支持，退回把原文件交给浏览器 —— 那是"不能"而不是"不做"。 */
const PAGED_EXT = ['.cbz', '.pdf'];
const isPaged = ext => PAGED_EXT.includes(String(ext || '').toLowerCase());

/* 切到同一部作品的另一话。下拉和左侧目录都走它 —— 逻辑只写一处。 */
function openChapter(own, i) {
  const c = (own.w.chapters || [])[i];
  if (!c) return;
  savePlace();                       // 先记住这一本读到哪了
  openComic(c.path, own.w.title + ' ' + c.label, isPaged(c.ext), 0);
}

/* 切换话数。跟播放器的选集是同一套思路 ——
   不用关掉阅读器再回列表找下一话。只有一话时把下拉藏起来。
   顺手把左侧「本话目录」也填上：阅读时想换话，眼睛在左侧，不该逼人回到顶栏下拉。 */
function buildChaps() {
  const sel = $('#rChap');
  sel.innerHTML = '';
  const own = workOfPath(reader.path);
  const chs = own ? (own.w.chapters || []) : [];
  // —— 左侧目录（本话列表）——
  const pane = $('#rChapPane');
  pane.innerHTML = '';
  if (!chs.length) {
    pane.appendChild(el('div', 'empty', '没找到这一部的话数'));
  } else {
    chs.forEach((c, i) => {
      const cur = own.idx === i;
      const b = el('button', 'titem flat' + (cur ? ' cur' : ''));
      b.appendChild(el('span', 'tt', esc(epOptionText(c.label, i, '话'))));
      b.title = c.path || '';
      b.onclick = () => { if (!cur) openChapter(own, i); };
      pane.appendChild(b);
    });
    pane.title = own.w.title + '　共 ' + chs.length + ' 话';
  }
  if (chs.length < 2) {
    sel.disabled = true;
    sel.style.display = 'none';
    return;
  }
  sel.style.display = '';
  sel.disabled = false;
  chs.forEach((c, i) => {
    const o = el('option', '', epOptionText(c.label, i, '话'));
    o.value = String(i);
    sel.appendChild(o);
  });
  sel.value = String(own.idx);
  sel.title = own.w.title + '　共 ' + chs.length + ' 话';
  sel.onchange = () => {
    const i = parseInt(sel.value, 10);
    sel.blur();                        // 交出焦点，别把键盘快捷键吃掉
    openChapter(own, i);
  };
}

const pageUrl = n => apiUrl(`/api/comic/page?path=${encodeURIComponent(reader.path)}&n=${n}`);

/* 宽高比 > 1.15 视为「合页大图」（横长）。普通漫画页是竖长的（约 0.7）。
   阈值取 1.15 而不是 1.0，是为了容忍轻微裁切和扫描歪斜。 */
const isWide = i => {
  const p = reader.pages[i];
  return !!(p && p.w > 0 && p.h > 0 && (p.w / p.h) > 1.15);
};

function buildSpreads() {
  const P = reader.pages, out = [];
  let i = 0;
  // 封面单独：只有双页模式下才有意义
  if (rmode.dual && rmode.cover && P.length > 1 && !isWide(0)) { out.push([0]); i = 1; }
  while (i < P.length) {
    if (!rmode.dual) { out.push([i]); i++; continue; }
    if (isWide(i)) { out.push([i]); i++; continue; }            // 合页大图：独占一屏
    if (i + 1 < P.length && !isWide(i + 1)) { out.push([i, i + 1]); i += 2; }
    else { out.push([i]); i++; }
  }
  return out;
}

const spreadOfPage = n => {
  for (let i = 0; i < reader.spreads.length; i++)
    if (reader.spreads[i].includes(n)) return i;
  return 0;
};

async function openComic(path, title, paged, startPage) {
  // 能分页的才进我们的阅读器：cbz（zip 图片）+ **pdf（服务端逐页渲染）**。
  // 其它（cbr/cb7…）确实没有内建支持，退回原文件交给浏览器是对的。
  if (!paged) { window.open(apiUrl('/file?path=' + encodeURIComponent(path)), '_blank'); return; }
  const info = await fetch(apiUrl('/api/comic?path=' + encodeURIComponent(path))).then(r => r.json());
  if (info.error) return toast('打不开：' + info.error);
  reader = { pages: info.pages || [], spreads: [], si: 0, path, title };
  prefetched.clear();                          // 换作品/换话必须清：页码 n 是作品内序号，会重号
  $('#rTitle').textContent = title;
  buildChaps();                                // 顺便把「切换话数」+ 左侧目录填上
  $('#reader').classList.add('on');
  refreshTrees();                              // 左侧作品树高亮正在读的这一部（要在 .on 之后）
  document.body.classList.add('reading');      // 锁住背景滚动
  refreshSpreads(startPage || 0);
}

function refreshSpreads(keepPage) {
  reader.spreads = buildSpreads();
  reader.si = spreadOfPage(keepPage || 0);
  syncToggles();
  renderSpread();
  savePlace();
}

function renderSpread() {
  const sp = $('#rSpread');
  sp.innerHTML = '';
  sp.classList.toggle('rtl', rmode.rtl);
  const pages = reader.spreads[reader.si];
  if (!pages) return;
  // DOM 顺序 = 阅读顺序。RTL 时靠 .spread 的 row-reverse 把第一页送到右边，
  // 所以这里不用为了方向颠倒数组 —— 逻辑和呈现分开，翻页计算才不会乱。
  for (const n of pages) {
    const im = el('img');
    im.src = pageUrl(n);
    im.alt = '';
    im.draggable = false;
    // 万一服务端没给出尺寸（异常图），等它加载完补测一次再重排
    im.onload = () => {
      const p = reader.pages[n];
      if (p && (!p.w || !p.h) && im.naturalWidth) {
        p.w = im.naturalWidth; p.h = im.naturalHeight;
        layoutSpread();
      }
    };
    sp.appendChild(im);
  }
  const a = pages[0] + 1, b = pages[pages.length - 1] + 1;
  $('#rPg').textContent = (pages.length === 1 ? `第 ${a} 页` : `第 ${a}-${b} 页`)
                        + ` / ${reader.pages.length}`;
  $('#rPrev').disabled = reader.si === 0;
  $('#rNext').disabled = reader.si === reader.spreads.length - 1;
  layoutSpread();
  preload();
}

/* 精确排版一屏。
   要点：**两页用同一个高度**（等比缩放，不拉伸），宽度按各自比例推出来，
   于是两页严丝合缝拼在一起 —— 不会像之前那样各占半宽、图居中、中间空出黑沟。
   高度同时受「可用高度」和「拼起来不能超过可用宽度」两个约束。 */
function layoutSpread() {
  const pages = reader.spreads[reader.si];
  const imgs = $('#rSpread').querySelectorAll('img');
  if (!pages || !imgs.length) return;
  const stage = $('#rstage').getBoundingClientRect();
  // 可用区要**减去舞台自己的内边距**（全屏模式下 padding 会被改成 0）。
  // 之前这两行写死 "- 16"，等于把 padding 的值抄进了 JS —— 一改 CSS 就对不上。
  const cs = getComputedStyle($('#rstage'));
  const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const availW = Math.max(80, stage.width - padX);
  const availH = Math.max(80, stage.height - padY);

  const dims = [];
  for (let k = 0; k < pages.length; k++) {
    const p = reader.pages[pages[k]] || {};
    dims.push({ w: p.w > 0 ? p.w : 800, h: p.h > 0 ? p.h : 1200, el: imgs[k] });
  }
  const H0 = Math.max(...dims.map(d => d.h));
  // 若统一按 H0 高，总宽会是多少 → 用它反推被宽度卡住时该用多高
  const needW = dims.reduce((a, d) => a + d.w * (H0 / d.h), 0);
  const H = Math.min(availH, needW > 0 ? availW * H0 / needW : availH);

  dims.forEach(d => {
    d.el.style.height = Math.round(H) + 'px';
    d.el.style.width = Math.round(d.w * (H / d.h)) + 'px';
  });
}

/* 预取前后各两屏，翻页不卡白。
   为什么是两屏：这条链路（DERP 中继）单页传输只要 53ms，但 RTT 是 252ms —— 
   83% 的等待花在往返而不是数据上。只预取一屏的话，每翻一屏必定撞一次这笔税；
   预取两屏，就是拿 0.2 秒的提前下载，换掉翻页时持续的 0.25 秒空等。 */
const prefetched = new Set();
function preload() {
  for (const d of [1, -1, 2, -2]) {
    const s = reader.spreads[reader.si + d];
    if (s) s.forEach(n => {
      if (prefetched.has(n)) return;      // 已取过的页不再重复 new Image，
      prefetched.add(n);                  // 否则每次 renderSpread 都要走一遍
      const i = new Image(); i.src = pageUrl(n);
    });
  }
}

function step(d) {
  const ns = reader.si + d;
  if (ns < 0 || ns >= reader.spreads.length) return;
  reader.si = ns;
  renderSpread();
  savePlace();
}

function savePlace() {
  const sp = reader.spreads[reader.si];
  if (!sp) return;
  PROG[reader.path] = { pos: sp[0] / Math.max(1, reader.pages.length),
                        title: reader.title, at: Date.now() / 1000 };
  fetch(apiUrl('/api/progress'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: reader.path, pos: PROG[reader.path].pos, title: reader.title })
  }).catch(() => {});
}

function syncToggles() {
  $('#rDual').textContent = rmode.dual ? '双页' : '单页';
  $('#rDual').classList.toggle('on', rmode.dual);
  $('#rDir').textContent = rmode.rtl ? '从右往左' : '从左往右';
  $('#rDir').classList.toggle('on', rmode.rtl);
  $('#rCover').classList.toggle('on', rmode.cover);
  $('#rCover').style.visibility = rmode.dual ? 'visible' : 'hidden';
  $('#rFull').classList.toggle('on', rFull);
  // 手机上没有键盘 —— 那串「D 单/双页 R 换方向」纯属噪音，还占掉两行。
  // 窄屏改成一句触摸提示，靠窗口大小时时更新（旋转屏也不出错）。
  const narrow = window.innerWidth <= 820;
  const nx = rmode.rtl ? '左侧下一页' : '右侧下一页';
  const pv = rmode.rtl ? '右侧上一页' : '左侧上一页';
  $('#rHint').textContent = narrow
    ? `${nx} · ${pv} · 滑动翻页`
    : '← → 翻页 · 空格翻页 · Esc 关闭';
}

/* ---------------- 全屏沉浸模式 ----------------
   两种叠加：类名 .full（收起所有界面，任何浏览器都有效）
             + Fullscreen API（连浏览器 UI 一起让位，支持才用）
   **两者要分开看**：iOS Safari 没有 Element.requestFullscreen，
   但它照样该能享受「整屏只有漫画」—— 所以 .full 不依赖 API。 */
let rFull = false;
let rUiTimer = 0;

/* 唤出界面。3 秒后自动收回 —— **收回界面时一并藏光标**。
   （原来给光标单开了一个 2.5s 定时器，还加了「界面可见就别藏」的守卫，
   结果两个定时器互相打架：光标定时器先到期、被守卫挡掉，界面再收回时
   光标就永远留在那了。合并成一个定时器就没有这种时序陷阱。） */
function showReaderUI() {
  if (!rFull) return;
  const el = $('#reader');
  el.classList.add('ui');
  el.classList.remove('idle');
  clearTimeout(rUiTimer);
  rUiTimer = setTimeout(() => {
    el.classList.remove('ui');
    if (rFull) el.classList.add('idle');
  }, 3000);
}

/* 立刻收回界面（点顶部那一下用它，要有即时反馈，不能等 3 秒）。 */
function hideReaderUI() {
  clearTimeout(rUiTimer);
  const el = $('#reader');
  el.classList.remove('ui');
  if (rFull) el.classList.add('idle');
}

function setReaderFull(on) {
  rFull = !!on;
  const el = $('#reader');
  el.classList.toggle('full', rFull);
  if (!rFull) {
    el.classList.remove('ui', 'idle');
    clearTimeout(rUiTimer);
  }
  // 真全屏：能进就进，进不去也不影响 .full 的效果。静默失败是对的 ——
  // 用户不该因为浏览器不支持就吃一个报错。
  try {
    if (rFull) {
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      }
    } else if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  } catch (e) { /* 忽略：不支持就没有真全屏 */ }
  syncToggles();
  // 收起顶栏后可用高度变了，书页要重排（先排一次、等过渡结束再排一次）
  setTimeout(layoutSpread, 40);
  setTimeout(layoutSpread, 300);
}

function toggleReaderFull() { setReaderFull(!rFull); }

function flipMode(field) {
  const cur = reader.spreads[reader.si] ? reader.spreads[reader.si][0] : 0;
  rmode[field] = !rmode[field];
  saveRmode();
  refreshSpreads(cur);
}

function closeReader() {
  setReaderFull(false);                 // 关之前先把全屏收干净，别留个残留状态
  $('#reader').classList.remove('on');
  document.body.classList.remove('reading');
  if (DETAIL) render();
}

/* 阅读器左侧目录的开关。和播放器的「播放列表」是同一套做法：按钮与 L 键共用一份状态，
   状态记进 localStorage（用户设一次就不想再设）。
   画面宽度一变必须重排书页 —— 书页尺寸是 layoutSpread() 算出来的像素值，
   不重排就会溢出或者留一大块空白。 */
const RSIDE_KEY = 'reslib.rSide';
function setRSide(on) {
  $('#rSide').classList.toggle('off', !on);
  $('#rTreeBtn').classList.toggle('on', on);
  localStorage.setItem(RSIDE_KEY, on ? '1' : '0');
  if (reader.spreads.length) layoutSpread();
}
function toggleRSide() { setRSide($('#rSide').classList.contains('off')); }

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  const nb = e.target.closest('nav button');
  if (nb) go(nb.dataset.t);
});
$('#q').addEventListener('input', e => { QUERY = e.target.value; render(); });
$('#rPrev').onclick = () => step(-1);
$('#rNext').onclick = () => step(1);
$('#rClose').onclick = closeReader;
$('#rDual').onclick = () => flipMode('dual');
$('#rDir').onclick = () => flipMode('rtl');
$('#rCover').onclick = () => flipMode('cover');
/* 目录默认开着（这就是阅读时要的东西）；窄屏上默认收起，并把书页留给内容。
   用户手动拨过一次之后就完全听 localStorage 的。 */
const RSIDE_SAVED = localStorage.getItem(RSIDE_KEY);
setRSide(RSIDE_SAVED === null ? window.innerWidth >= 820 : RSIDE_SAVED === '1');
$('#rTreeBtn').onclick = toggleRSide;

$('#rFull').onclick = toggleReaderFull;

/* 点左半屏/右半屏翻页。方向反过来时语义也跟着反 ——
   从右往左读的时候，「往前」是往左走。
   全屏模式下顶部仍然保留安全区，不把点击误判成翻页；退出全屏交给浏览器。 */
$('#rstage').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (rFull && (e.clientY - r.top) < r.height * 0.15) {
    // 真全屏期间顶栏不提供网页内退出入口，交给浏览器的退出全屏操作。
    return;
  }
  const leftHalf = (e.clientX - r.left) < r.width / 2;
  const goNext = rmode.rtl ? leftHalf : !leftHalf;
  step(goNext ? 1 : -1);
};

/* 真全屏被系统退出时（F11 / 浏览器手势 / Esc），把 .full 也同步关掉，
   退出事件只在这里恢复普通顶栏。 */
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && rFull) {
    setReaderFull(false);
  }
});

/* 滚轮翻页（漫画阅读器的习惯操作）。加节流，否则一次滚轮会连翻好几页。 */
let wheelLock = 0;
$('#rstage').addEventListener('wheel', e => {
  e.preventDefault();
  const now = Date.now();
  if (now < wheelLock) return;
  if (Math.abs(e.deltaY) < 4) return;
  wheelLock = now + 260;
  const down = e.deltaY > 0;
  step((rmode.rtl ? down : !down) ? 1 : -1);
}, { passive: false });

/* 尺寸是 JS 算出来的像素值，所以窗口一变必须重排，否则会留白或被裁。
   手机旋转屏幕时顶栏格局也会变（窄屏/宽屏两套），提示文案要跟着换。 */
window.addEventListener('resize', () => {
  if ($('#reader').classList.contains('on')) { syncToggles(); layoutSpread(); }
});
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    if ($('#reader').classList.contains('on')) layoutSpread();
  }).observe($('#rstage'));
}

document.addEventListener('keydown', e => {
  // 播放器开着时优先吃键
  if ($('#vp').classList.contains('on')) {
    const t = e.target;
    // **但焦点在左侧播放列表、或任何一个下拉/输入框上时，就放行** ——
    // 否则在树上按方向键会被拿去调进度，在下拉上按方向键会被拿去换字幕轨。
    if (t && t.closest && t.closest('.treepane')) return;
    const tag = (t && t.tagName) || '';
    if ((tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') && e.key !== 'Escape') return;
    if (e.key === 'Escape') { e.preventDefault(); closePlayer(); return; }
    if (e.key === ' ' || e.key === 'k' || e.key === 'K') { e.preventDefault(); vpPlayToggle(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); vpSeek(vpAbs() + 5); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); vpSeek(vpAbs() - 5); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault(); vpEl().volume = Math.min(1, vpEl().volume + 0.05); return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault(); vpEl().volume = Math.max(0, vpEl().volume - 0.05); return;
    }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); vpFullscreen(); return; }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); vpEl().muted = !vpEl().muted; return; }
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleSide(); return; }
    return;
  }
  if ($('#reader').classList.contains('on')) {
    // 焦点在下拉/输入上时放行，让方向键能用来选话；
    // 在左侧目录上按方向键也要放行（不然会被拿去翻页，目录没法滚）
    const rt = e.target;
    if (rt && rt.closest && rt.closest('.treepane')) return;
    const rtag = (rt && rt.tagName) || '';
    if ((rtag === 'SELECT' || rtag === 'INPUT' || rtag === 'TEXTAREA') && e.key !== 'Escape') return;
    const fwd  = rmode.rtl ? ['ArrowLeft', ' ', 'PageDown'] : ['ArrowRight', ' ', 'PageDown'];
    const back = rmode.rtl ? ['ArrowRight', 'PageUp'] : ['ArrowLeft', 'PageUp'];
    // Esc 分两级：全屏时先退出全屏，再按才关阅读器。
    // 一次就把阅读器关掉的话，用户想退出全屏却丢了阅读进度，很恼人。
    if (e.key === 'Escape') {
      if (rFull) { e.preventDefault(); setReaderFull(false); return; }
      closeReader(); return;
    }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleReaderFull(); return; }
    if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleRSide(); return; }
    if (fwd.includes(e.key)) { e.preventDefault(); step(1); return; }
    if (back.includes(e.key)) { e.preventDefault(); step(-1); return; }
    if (e.key === 'Home') { e.preventDefault(); reader.si = 0; renderSpread(); return; }
    if (e.key === 'End') { e.preventDefault(); reader.si = reader.spreads.length - 1; renderSpread(); return; }
    if (e.key === 'd' || e.key === 'D') { flipMode('dual'); return; }
    if (e.key === 'r' || e.key === 'R') { flipMode('rtl'); return; }
    return;
  }
  if (e.key === 'Escape' && DETAIL) back();
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
});

load();
</script>
</body>
</html>
